<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title data-i18n="page.botdee.title">BOT DEE</title>
  <script>
    /* Paint Site chrome before CSS so BOT DEE is not stuck on Nightlife. */
    try{
      var __floqrChromeMap={0:"nightlife",1:"traditional",2:"blackTiffany",3:"whiteBlack",4:"purpleWhite",5:"blackDarkGreen"};
      var __floqrChromeRaw=localStorage.getItem("floqr.isSiteChrome");
      var __floqrChrome=__floqrChromeMap[__floqrChromeRaw];
      if(!__floqrChrome){
        var __legacy=String(localStorage.getItem("floqr.uiChrome")||"").trim();
        if(__legacy==="traditional"||__legacy==="nightlife"||__legacy==="blackTiffany"||__legacy==="whiteBlack"||__legacy==="blackDarkGreen"||__legacy==="purpleWhite") __floqrChrome=__legacy;
      }
      if(__floqrChrome){
        document.documentElement.setAttribute("data-floqr-chrome",__floqrChrome);
        document.documentElement.setAttribute("data-is-site-chrome",String(__floqrChromeRaw!=null&&__floqrChromeRaw!==""?__floqrChromeRaw:({nightlife:0,traditional:1,blackTiffany:2,whiteBlack:3,purpleWhite:4,blackDarkGreen:5})[__floqrChrome]));
      }
    }catch(_){}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./styles.css?v=s3.3.024"/>
  <link rel="stylesheet" href="./floqr-feature-landing.css?v=s3.3.024"/>
  <link rel="stylesheet" href="./botdee-search.css?v=s3.3.024"/>
  <link rel="stylesheet" href="./bot-dee-chat.css?v=s3.3.024"/></head>
<body class="botdee-standalone botdee-page" data-floqr-feature="botDee">
<main class="botdee-standalone-main botdee-shell">
  <a id="floqrGlobalBack" class="global-back-btn buttonlike" data-from="search" href="./?start=search">&lt; Back</a>

  <section id="botDeeChatPage" class="page botdee-chat-page active" aria-label="BOT DEE chat">
    <header class="botdee-chat-header">
      <div class="botdee-chat-header-main">
        <img data-floqr-chrome-icon="botDee" src="./images/chrome/botdee-nightlife.jpg" alt="" class="botdee-chat-icon" width="56" height="56"/>
        <div class="botdee-title-row feature-landing-title-row">
          <h1 class="botdee-chat-title floqr-page-title" data-i18n="page.botdee.title">BOT DEE</h1>
        </div>
      </div>
    </header>

    <div id="botDeeTranscript" class="botdee-transcript" aria-live="polite" aria-relevant="additions"></div>
    <p id="botDeeChatStatus" class="sub small botdee-chat-status" role="status"></p>

    <form id="botDeeChatForm" class="botdee-chat-form" autocomplete="off">
      <label class="botdee-chat-label" for="botDeeChatInput">
        <span class="visually-hidden" data-i18n="botdee.prompt">Tell me what you want to do</span>
        <textarea id="botDeeChatInput" rows="2" maxlength="2000" data-i18n-placeholder="botdee.chatPlaceholder" placeholder="Ask BOT DEE…" aria-describedby="botDeeChatStatus botDeeComposerHint"></textarea>
      </label>
      <button id="botDeeChatSend" class="buttonlike botdee-chat-send" type="submit" data-i18n="botdee.chatSend">Send</button>
    </form>
    <p id="botDeeComposerHint" class="visually-hidden">Press Enter to send a message. Shift+Enter starts a new line. Type help or privacy for more.</p>
    <p class="botdee-prefs-row">
      <button id="botDeePrefsOpen" class="buttonlike botdee-prefs-open" type="button" data-i18n="botdee.prefsOpen">Settings</button>
    </p>
    <div id="botDeePersonalizationDialog" class="botdee-pref-dialog" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="botDeePrefTitle">
      <div class="botdee-pref-card">
        <h2 id="botDeePrefTitle" class="botdee-pref-title" data-i18n="botdee.prefsTitle">BOT DEE settings</h2>
        <label class="botdee-pref-field" for="botDeePrefName">
          <span data-i18n="botdee.callMe">What should I call you?</span>
          <input id="botDeePrefName" type="text" maxlength="40" autocomplete="nickname"/>
        </label>
        <fieldset class="botdee-pref-field">
          <legend data-i18n="botdee.demeanorAsk">What demeanor would you prefer: Socially Cool, Professional or Balanced?</legend>
          <label><input type="radio" name="botDeePrefDemeanor" value="sociallyCool"/> <span data-i18n="botdee.demeanorCool">Socially Cool</span></label>
          <label><input type="radio" name="botDeePrefDemeanor" value="professional"/> <span data-i18n="botdee.demeanorPro">Professional</span></label>
          <label><input type="radio" name="botDeePrefDemeanor" value="balanced" checked/> <span data-i18n="botdee.demeanorBalanced">Balanced</span></label>
        </fieldset>
        <label class="botdee-pref-check" for="botDeePrefRecap">
          <input id="botDeePrefRecap" type="checkbox" checked/>
          <span data-i18n="botdee.prefsRecap">Remind me where we left off</span>
        </label>
        <p id="botDeePrefStatus" class="sub small" role="status"></p>
        <div class="botdee-pref-actions">
          <button id="botDeePrefSave" class="buttonlike" type="button" data-i18n="botdee.prefsSave">Save &amp; Close</button>
          <button id="botDeePrefCancel" class="buttonlike" type="button" data-i18n="botdee.prefsCancel">Cancel</button>
        </div>
      </div>
    </div>
  </section>
</main>

</body>
