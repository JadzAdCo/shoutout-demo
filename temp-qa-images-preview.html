<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Temp QA images preview</title>
  <style>
    body { margin: 0; font-family: Georgia, "Times New Roman", serif; background: #0b1020; color: #f4f6ff; }
    header { padding: 28px 24px 12px; }
    h1 { margin: 0 0 8px; font-size: 34px; letter-spacing: -0.03em; }
    p { margin: 0; color: #b7c0da; }
    section { padding: 12px 24px 28px; }
    h2 { margin: 18px 0 12px; font-size: 22px; }
    .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
    .row.wide { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    figure { margin: 0; background: #121826; border: 1px solid rgba(255,255,255,.12); border-radius: 16px; overflow: hidden; }
    img { display: block; width: 100%; height: 160px; object-fit: cover; background: #0a0f1c; }
    .row.wide img { height: 220px; }
    figcaption { padding: 8px 10px 10px; font-size: 12px; color: #b7c0da; word-break: break-all; }
  </style>
</head>
<body>
  <header>
    <h1>Temp QA photoreal images</h1>
    <p>Shared PNG logos, venue art, and service-member portraits in <code>images/temp-qa</code>.</p>
  </header>
  <section>
    <h2>Venue media</h2>
    <div class="row wide">
      <figure><img src="./images/temp-qa/club-1-venue.png" alt="lounge venue"/><figcaption>club-1-venue.png</figcaption></figure>
      <figure><img src="./images/temp-qa/club-rooftop.png" alt="rooftop venue"/><figcaption>club-rooftop.png</figcaption></figure>
      <figure><img src="./images/temp-qa/club-speakeasy.png" alt="speakeasy venue"/><figcaption>club-speakeasy.png</figcaption></figure>
      <figure><img src="./images/temp-qa/club-gallery-vip.png" alt="VIP gallery"/><figcaption>club-gallery-vip.png</figcaption></figure>
      <figure><img src="./images/temp-qa/club-gallery-entrance.png" alt="entrance gallery"/><figcaption>club-gallery-entrance.png</figcaption></figure>
    </div>
    <h2>People</h2>
    <div class="row">
      <figure><img src="./images/temp-qa/dj-jordan.png" alt="DJ Jordan"/><figcaption>dj-jordan.png</figcaption></figure>
      <figure><img src="./images/temp-qa/dj-maya.png" alt="DJ Maya"/><figcaption>dj-maya.png</figcaption></figure>
      <figure><img src="./images/temp-qa/dj-rico.png" alt="DJ Rico"/><figcaption>dj-rico.png</figcaption></figure>
      <figure><img src="./images/temp-qa/staff-priya.png" alt="Priya"/><figcaption>staff-priya.png</figcaption></figure>
      <figure><img src="./images/temp-qa/staff-luis.png" alt="Luis"/><figcaption>staff-luis.png</figcaption></figure>
      <figure><img src="./images/temp-qa/staff-sienna.png" alt="Sienna"/><figcaption>staff-sienna.png</figcaption></figure>
      <figure><img src="./images/temp-qa/staff-amara.png" alt="Amara"/><figcaption>staff-amara.png</figcaption></figure>
      <figure><img src="./images/temp-qa/staff-nia.png" alt="Nia"/><figcaption>staff-nia.png</figcaption></figure>
      <figure><img src="./images/temp-qa/staff-marcus.png" alt="Marcus"/><figcaption>staff-marcus.png</figcaption></figure>
      <figure><img src="./images/temp-qa/promo-collective-logo.png" alt="promo collective"/><figcaption>promo-collective-logo.png</figcaption></figure>
    </div>
    <h2>Club logos 1–10</h2>
    <div class="row">
      <figure><img src="./images/temp-qa/club-1-logo.png" alt="logo 1"/><figcaption>club-1-logo.png · Aurelia</figcaption></figure>
      <figure><img src="./images/temp-qa/club-2-logo.png" alt="logo 2"/><figcaption>club-2-logo.png · Volt Room</figcaption></figure>
      <figure><img src="./images/temp-qa/club-3-logo.png" alt="logo 3"/><figcaption>club-3-logo.png · Nectar</figcaption></figure>
      <figure><img src="./images/temp-qa/club-4-logo.png" alt="logo 4"/><figcaption>club-4-logo.png · Panthera</figcaption></figure>
      <figure><img src="./images/temp-qa/club-5-logo.png" alt="logo 5"/><figcaption>club-5-logo.png · Luna Fold</figcaption></figure>
      <figure><img src="./images/temp-qa/club-6-logo.png" alt="logo 6"/><figcaption>club-6-logo.png · Facet</figcaption></figure>
      <figure><img src="./images/temp-qa/club-7-logo.png" alt="logo 7"/><figcaption>club-7-logo.png · After Koi</figcaption></figure>
      <figure><img src="./images/temp-qa/club-8-logo.png" alt="logo 8"/><figcaption>club-8-logo.png · Strike</figcaption></figure>
      <figure><img src="./images/temp-qa/club-9-logo.png" alt="logo 9"/><figcaption>club-9-logo.png · Orchid Frequency</figcaption></figure>
      <figure><img src="./images/temp-qa/club-10-logo.png" alt="logo 10"/><figcaption>club-10-logo.png · Northstar</figcaption></figure>
    </div>
  </section>
</body>
</html>
