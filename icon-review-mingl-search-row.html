<!doctype html>
<html lang="en" data-floqr-chrome="nightlife" data-floqr-theme-ungated="1">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Mingl Search row — local review</title>
  <link rel="stylesheet" href="./styles.css?v=s3.3.087"/>
  <style>
    html,body{margin:0;background:#07070f;min-height:100%}
    body{padding:28px 20px}
    .search-icon-row{justify-content:center;flex-wrap:nowrap}
  </style>
</head>
<body>
  <div class="search-icon-row">
    <span class="shoutout-icon-card"><span class="shoutout-icon-face chrome-photo-face"><img src="./images/chrome/shoutout-nightlife.png" alt="" class="shoutout-tile-mark" width="96" height="96"/></span></span>
    <span class="shoutout-icon-card"><span class="botdee-icon-face chrome-photo-face"><img src="./images/chrome/botdee-nightlife.jpg" alt="" class="botdee-tile-mark" width="96" height="96"/></span></span>
    <span class="shoutout-icon-card"><span class="vip-icon-face chrome-photo-face"><img src="./images/chrome/vip-nightlife.jpg" alt="" class="vip-tile-mark" width="96" height="96"/></span></span>
    <span class="shoutout-icon-card"><span class="settings-icon-face chrome-photo-face"><img src="./images/chrome/settings-nightlife.jpg" alt="" class="settings-tile-mark" width="96" height="96"/></span></span>
    <span class="shoutout-icon-card"><span class="floqcast-icon-face chrome-photo-face"><img src="./images/chrome/floqcast-nightlife.jpg" alt="" class="floqcast-tile-mark" width="96" height="96"/></span></span>
    <span class="shoutout-icon-card"><span class="sinema-icon-face chrome-photo-face"><img src="./images/chrome/sinema-nightlife.jpg" alt="" class="sinema-tile-mark" width="96" height="96"/></span></span>
    <button id="minglBtnCard" class="shoutout-icon-card mingl-icon-card" type="button" aria-label="Mingl">
      <span class="mingl-icon-face chrome-photo-face" aria-hidden="true">
        <img data-floqr-chrome-icon="mingl" src="./images/chrome/mingl-nightlife.jpg" alt="" class="mingl-tile-mark" width="96" height="96"/>
      </span>
    </button>
  </div>
</body>
</html>
