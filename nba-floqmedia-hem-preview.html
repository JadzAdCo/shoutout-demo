<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>NBA FloqMedia hem preview (96×48)</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alumni+Sans+Collegiate+One&display=swap">
  <link rel="stylesheet" href="./display.css?v=s3.3.002"/>
  <style>
    body{margin:0;background:#111;color:#eee;font-family:Georgia,"Times New Roman",serif}
    h1{font-size:18px;margin:12px 16px 4px;font-weight:600}
    p{margin:0 16px 12px;font-size:13px;opacity:.85;max-width:720px}
    .stage{width:960px;height:480px;margin:12px 16px;border:1px solid #333;overflow:hidden;position:relative}
    .note{margin:8px 16px 24px;font-size:12px;opacity:.7}
  </style>
</head>
<body>
  <h1>Maryland Terps — FloqMedia under hem (led-96×48)</h1>
  <p>Portrait tank is height-fit (86%) so the hem stays on the board. FloqMedia rail is pinned to the bottom band, not mid-kit.</p>
  <div class="stage">
    <main id="displayCanvas" class="display-canvas soccer-jersey-template sports-jersey-template jersey-sport-nba jersey-photo-back has-background-layer"
          data-screen-format-id="led-96x48" data-is-96x48="1"
          style="--jersey-primary:#E21833;--jersey-secondary:#FFFFFF;--jersey-accent:#FFD520;--nba-kit-top:1%;--nba-kit-h:86%;--nba-kit-left:34%;--nba-kit-right:34%;--nba-kit-w:32%;width:960px;height:480px;animation:none">
      <div id="displayBackground" class="display-background" aria-hidden="true"
           style="background-image:url('./images/basketball/maryland-terps-2026-back.jpg')"></div>
      <div class="display-text-overlay">
        <div class="display-compose-slot">
          <div class="display-center">
            <div id="displayJerseyTeam" class="soccer-jersey-team jersey-overlay-word" aria-hidden="false">MARYLAND</div>
            <h1 id="displayMain" class="soccer-jersey-name">PRINCE</h1>
            <h2 id="displaySub" class="soccer-jersey-number jersey-alumni-num" style="--jersey-num-outline:#fff">23</h2>
          </div>
        </div>
      </div>
      <div id="displayIdentityRail" class="display-identity-rail classic-bw-identity soccer-jersey-rail floqr-card-bottom" aria-hidden="false">
        <span class="classic-identity-shell"><small>PRESENTED BY</small><strong>FloqMedia</strong></span>
      </div>
    </main>
  </div>
  <p class="note">Local QA only — not a Search / Pages surface.</p>
</body>
</html>
