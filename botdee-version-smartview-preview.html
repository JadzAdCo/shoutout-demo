<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>BOT DEE Version SMARTview preview</title>
  <script>
    try{
      var __floqrChromeMap={0:"nightlife",1:"traditional",2:"blackTiffany",3:"whiteBlack",4:"purpleWhite",5:"blackDarkGreen"};
      var __floqrChromeRaw=localStorage.getItem("floqr.isSiteChrome");
      var __floqrChrome=__floqrChromeMap[__floqrChromeRaw];
      if(!__floqrChrome){
        var __legacy=String(localStorage.getItem("floqr.uiChrome")||"").trim();
        if(__legacy==="traditional"||__legacy==="nightlife"||__legacy==="blackTiffany"||__legacy==="whiteBlack"||__legacy==="blackDarkGreen"||__legacy==="purpleWhite") __floqrChrome=__legacy;
      }
      if(!__floqrChrome) __floqrChrome="blackTiffany";
      var __shot=new URLSearchParams(location.search).get("chrome");
      if(__shot) __floqrChrome=__shot;
      document.documentElement.setAttribute("data-floqr-chrome",__floqrChrome);
    }catch(_){}
  </script>
  <link rel="stylesheet" href="./styles.css?v=s3.3.034"/>
  <link rel="stylesheet" href="./bot-dee-chat.css?v=s3.3.034"/>
  <link rel="stylesheet" href="./botdee-smartview.css?v=s3.3.034"/>
  <style>
    body { margin: 0; max-width: 430px; margin-inline: auto; padding: 12px 14px 88px; }
    .preview-note { font-size: 12px; opacity: 0.75; margin: 0 0 10px; }
    .chrome-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
    .chrome-row button {
      min-height: 36px;
      width: auto !important;
      flex: 1 1 auto;
      padding: 6px 8px;
      font-size: 11px;
    }
    .preview-user { align-self: flex-end; margin-left: auto; max-width: 70%; }
    .preview-composer {
      position: sticky;
      bottom: 0;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px 0 6px;
      background: color-mix(in srgb, var(--floqr-ink, #05080a) 88%, transparent);
    }
    .preview-composer input {
      flex: 1;
      min-width: 0;
      border-radius: 28px;
      padding: 12px 15px;
    }
    .preview-send {
      width: 42px;
      height: 42px;
      min-height: 42px;
      width: 42px !important;
      border-radius: 50%;
      padding: 0;
      background: var(--accent, #00d4fe);
      color: var(--floqr-ink, #001617);
      border: 0;
      font-size: 18px;
    }
    html[data-shot] .preview-note,
    html[data-shot] .chrome-row { display: none; }
  </style>
</head>
<body class="botdee-page" data-floqr-public>
  <p class="preview-note">Local QA only — not a Search tile. Live stamps, Not checked (never Operational). Switch Site Chrome to confirm tokens.</p>
  <div class="chrome-row" id="chromeRow"></div>
  <div class="botdee-bubble botdee-bubble-user preview-user">
    <div class="botdee-bubble-text">Version</div>
  </div>
  <div class="botdee-bubble botdee-bubble-bot">
    <div class="botdee-bubble-text">Here's the current version information for FLOQR and BOT DEE.</div>
    <div class="botdee-sv-host" id="host"></div>
  </div>
  <form class="preview-composer" id="composer">
    <input id="message" aria-label="Message BOT DEE" placeholder="Message BOT DEE..."/>
    <button class="preview-send" type="submit" aria-label="Send">➤</button>
  </form>
  <script src="./floqr-i18n.js?v=s3.3.034"></script>
  <script src="./floqr-nav.js?v=s3.3.034"></script>
  <script src="./floqr-chrome-scheme.js?v=s3.3.034"></script>
  <script src="./botdee-smartview.js?v=s3.3.034"></script>
  <script>
    if (new URLSearchParams(location.search).has("shot")) {
      document.documentElement.setAttribute("data-shot", "1");
    }
    const themes = ["nightlife","traditional","blackTiffany","whiteBlack","purpleWhite","blackDarkGreen"];
    const row = document.getElementById("chromeRow");
    themes.forEach((id, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id;
      b.addEventListener("click", () => {
        document.documentElement.setAttribute("data-floqr-chrome", id);
        localStorage.setItem("floqr.isSiteChrome", String(i));
      });
      row.appendChild(b);
    });
    const payload = {
      schemaVersion: "floqr.botDeeVersionSmartView/1",
      kind: "botDeeVersion",
      generatedAtIso: new Date().toISOString(),
      botDee: {packageLabel: (window.FLOQRNav && FLOQRNav.appVersion) || "s3.3.032", packageVersion: "3.3.032"},
      floqr: {backendPackage: "s3.3.032", frontendPackage: (window.FLOQRNav && FLOQRNav.appVersion) || "s3.3.032"},
      model: {configuredId: "gemini-3.6-flash", sessionPath: "local-version", sessionModel: null, usedThisTurn: false},
      service: {status: "not_checked", lastCheckAtIso: null},
      changelog: [
        {id: "s3.3.032", text: "s3.3.032: BOT DEE Version SMARTview (Ver / Vers / Version)"},
        {id: "s3.3.031", text: "s3.3.031: SMARTview spelling + public-page Profile Media"}
      ],
      environment: "pr_not_production"
    };
    FLOQRBotDeeSmartView.mount(document.getElementById("host"), [payload]);
    document.getElementById("composer").addEventListener("submit", event => {
      event.preventDefault();
    });
  </script>
</body>
</html>
