<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="floqCast">
  <defs>
    <linearGradient id="fcBeam" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#26d8ff"/>
      <stop offset="55%" stop-color="#7a5cff"/>
      <stop offset="100%" stop-color="#f43abf"/>
    </linearGradient>
    <linearGradient id="fcLed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2240"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>
  </defs>
  <!-- Patron phone / camera capture -->
  <rect x="4" y="18" width="16" height="28" rx="3.5" fill="#0b1020" stroke="url(#fcBeam)" stroke-width="1.6"/>
  <rect x="6.5" y="21" width="11" height="18" rx="1.5" fill="#12182c"/>
  <circle cx="12" cy="30" r="3.2" fill="none" stroke="#26d8ff" stroke-width="1.4"/>
  <circle cx="12" cy="30" r="1.2" fill="#f43abf"/>
  <rect x="9" y="41.5" width="6" height="1.6" rx="0.8" fill="#dfff5a"/>
  <!-- Cast beam (phone ’ LED wall) -->
  <path d="M22 28 C28 24, 34 24, 40 28" fill="none" stroke="url(#fcBeam)" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
  <path d="M22 32 C29 30, 35 30, 40 32" fill="none" stroke="url(#fcBeam)" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <path d="M22 36 C28 38, 34 38, 40 36" fill="none" stroke="url(#fcBeam)" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  <!-- FloqMedia LED display -->
  <rect x="40" y="16" width="20" height="32" rx="3" fill="url(#fcLed)" stroke="url(#fcBeam)" stroke-width="1.6"/>
  <g fill="#26d8ff">
    <rect x="43" y="20" width="3.2" height="3.2" rx="0.6" opacity="0.95"/>
    <rect x="48" y="20" width="3.2" height="3.2" rx="0.6" opacity="0.7"/>
    <rect x="53" y="20" width="3.2" height="3.2" rx="0.6" opacity="0.95"/>
    <rect x="43" y="25.5" width="3.2" height="3.2" rx="0.6" fill="#f43abf" opacity="0.9"/>
    <rect x="48" y="25.5" width="3.2" height="3.2" rx="0.6" fill="#7a5cff" opacity="0.95"/>
    <rect x="53" y="25.5" width="3.2" height="3.2" rx="0.6" fill="#dfff5a" opacity="0.85"/>
    <rect x="43" y="31" width="3.2" height="3.2" rx="0.6" opacity="0.65"/>
    <rect x="48" y="31" width="3.2" height="3.2" rx="0.6" fill="#f43abf" opacity="0.75"/>
    <rect x="53" y="31" width="3.2" height="3.2" rx="0.6" opacity="0.9"/>
    <rect x="43" y="36.5" width="3.2" height="3.2" rx="0.6" fill="#7a5cff" opacity="0.8"/>
    <rect x="48" y="36.5" width="3.2" height="3.2" rx="0.6" opacity="0.95"/>
    <rect x="53" y="36.5" width="3.2" height="3.2" rx="0.6" fill="#f43abf" opacity="0.7"/>
