<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="floqCast">
  <defs>
    <linearGradient id="fcStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#26d8ff"/>
      <stop offset="55%" stop-color="#7a5cff"/>
      <stop offset="100%" stop-color="#f43abf"/>
    </linearGradient>
    <linearGradient id="fcCabinet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3348"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="fcFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1424"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>
    <clipPath id="fcLedClip">
      <rect x="24.2" y="15.2" width="36.6" height="25.6" rx="1.4"/>
    </clipPath>
  </defs>

  <!-- Phone (Image 1: white outline, tilted toward the board) -->
  <g transform="translate(11 39) rotate(-38)">
    <rect x="-6" y="-12.5" width="12" height="25" rx="2.5" fill="#0b1020" stroke="#f2f6ff" stroke-width="1.7"/>
    <rect x="-4" y="-9.8" width="8" height="15.5" rx="1.1" fill="#12192c"/>
    <circle cx="0" cy="9.6" r="1.15" fill="#f2f6ff"/>
  </g>

  <!-- Framing rays (Image 1) -->
  <path d="M16.5 28.5 L28.5 18.5" fill="none" stroke="#ff2d55" stroke-width="1.1" stroke-linecap="round" opacity="0.75"/>
  <path d="M16.8 41.5 L29.5 46.5" fill="none" stroke="#26d8ff" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>

  <!-- Wireless arcs (Image 1 — keep these) -->
  <path d="M15.5 29.8 C20.2 24.5, 26.2 22.6, 31.5 24.8" fill="none" stroke="#26d8ff" stroke-width="1.9" stroke-linecap="round"/>
  <path d="M16.0 33.2 C21.5 27.4, 28.0 25.4, 33.8 28.0" fill="none" stroke="#26d8ff" stroke-width="1.55" stroke-linecap="round" opacity="0.82"/>
  <path d="M16.4 36.5 C22.2 30.4, 29.2 28.4, 35.5 31.2" fill="none" stroke="#26d8ff" stroke-width="1.25" stroke-linecap="round" opacity="0.62"/>

  <!-- Solid red cast arrow (Image 1 — keep these) -->
  <path d="M17.2 34.8 L30.2 30.2 L30.2 33.0 L36.2 33.0 L36.2 36.6 L30.2 36.6 L30.2 39.4 Z" fill="#ff2d55"/>

  <!-- FloqMedia LED display board (hero — landscape cabinet like 96×48, NOT a TV; no feet) -->
  <rect x="22.5" y="12.8" width="40" height="30.4" rx="2.8" fill="url(#fcCabinet)" stroke="url(#fcStroke)" stroke-width="1.9"/>
  <rect x="24.2" y="15.2" width="36.6" height="25.6" rx="1.4" fill="url(#fcFace)"/>
  <!-- top edge LED lip -->
  <rect x="24.2" y="15.2" width="36.6" height="1.5" rx="0.7" fill="#26d8ff" opacity="0.28"/>

  <!-- FloqMedia LED modules (rounded squares — brand palette) + red cast arrow on face -->
  <g clip-path="url(#fcLedClip)">
    <!-- Row 1 -->
    <rect x="25.4" y="16.6" width="4.2" height="4.2" rx="0.85" fill="#26d8ff" opacity="0.85"/>
    <rect x="30.2" y="16.6" width="4.2" height="4.2" rx="0.85" fill="#26d8ff" opacity="0.55"/>
    <rect x="35.0" y="16.6" width="4.2" height="4.2" rx="0.85" fill="#7a5cff" opacity="0.9"/>
    <rect x="39.8" y="16.6" width="4.2" height="4.2" rx="0.85" fill="#26d8ff" opacity="0.7"/>
    <rect x="44.6" y="16.6" width="4.2" height="4.2" rx="0.85" fill="#f43abf" opacity="0.85"/>
    <rect x="49.4" y="16.6" width="4.2" height="4.2" rx="0.85" fill="#26d8ff" opacity="0.55"/>
    <rect x="54.2" y="16.6" width="4.2" height="4.2" rx="0.85" fill="#26d8ff" opacity="0.8"/>
    <!-- Row 2 -->
    <rect x="25.4" y="21.4" width="4.2" height="4.2" rx="0.85" fill="#26d8ff" opacity="0.55"/>
    <rect x="30.2" y="21.4" width="4.2" height="4.2" rx="0.85" fill="#dfff5a" opacity="0.9"/>
    <rect x="35.0" y="21.4" width="4.2" height="4.2" rx="0.85" fill="#26d8ff" opacity="0.75"/>
    <rect x="39.8" y="21.4" width="4.2" height="4.2" rx="0.85" fill="#ff2d55"/>
    <rect x="44.6" y="21.4" width="4.2" height="4.2" rx="0.85" fill="#ff2d55"/>
    <rect x="49.4" y="21.4" width="4.2" height="4.2" rx="0.85" fill="#ff2d55"/>
    <rect x="54.2" y="21.4" width="4.2" height="4.2" rx="0.85" fill="#26d8ff" opacity="0.55"/>
    <!-- Row 3 (arrow shaft + head start) -->
    <rect x="25.4" y="26.2" width="4.2" height="4.2" rx="0.85" fill="#7a5cff" opacity="0.85"/>
    <rect x="30.2" y="26.2" width="4.2" height="4.2" rx="0.85" fill="#26d8ff" opacity="0.65"/>
    <rect x="35.0" y="26.2" width="4.2" height="4.2" rx="0.85" fill="#ff2d55"/>
    <rect x="39.8" y="26.2" width="4.2" height="4.2" rx="0.85" fill="#ff2d55"/>
    <rect x="44.6" y="26.2" width="4.2" height="4.2" rx="0.85" fill="#ff2d55"/>
    <rect x="49.4" y="26.2" width="4.2" height="4.2" rx="0.85" fill="#ff2d55"/>
    <rect x="54.2" y="26.2" width="4.2" height="4.2" rx="0.85" fill="#ff2d55"/>
    <!-- Row 4 -->
    <rect x="25.4" y="31.0" width="4.2" height="4.2" rx="0.85" fill="#26d8ff" opacity="0.7"/>
    <rect x="30.2" y="31.0" width="4.2" height="4.2" rx="0.85" fill="#f43abf" opacity="0.85"/>
    <rect x="35.0" y="31.0" width="4.2" height="4.2" rx="0.85" fill="#26d8ff" opacity="0.55"/>
    <rect x="39.8" y="31.0" width="4.2" height="4.2" rx="0.85" fill="#ff2d55"/>
    <rect x="44.6" y="31.0" width="4.2" height="4.2" rx="0.85" fill="#ff2d55"/>
    <rect x="49.4" y="31.0" width="4.2" height="4.2" rx="0.85" fill="#ff2d55"/>
    <rect x="54.2" y="31.0" width="4.2" height="4.2" rx="0.85" fill="#26d8ff" opacity="0.75"/>
    <!-- Row 5 -->
    <rect x="25.4" y="35.8" width="4.2" height="4.2" rx="0.85" fill="#26d8ff" opacity="0.55"/>
    <rect x="30.2" y="35.8" width="4.2" height="4.2" rx="0.85" fill="#26d8ff" opacity="0.8"/>
    <rect x="35.0" y="35.8" width="4.2" height="4.2" rx="0.85" fill="#dfff5a" opacity="0.85"/>
    <rect x="39.8" y="35.8" width="4.2" height="4.2" rx="0.85" fill="#26d8ff" opacity="0.6"/>
    <rect x="44.6" y="35.8" width="4.2" height="4.2" rx="0.85" fill="#7a5cff" opacity="0.9"/>
    <rect x="49.4" y="35.8" width="4.2" height="4.2" rx="0.85" fill="#26d8ff" opacity="0.7"/>
    <rect x="54.2" y="35.8" width="4.2" height="4.2" rx="0.85" fill="#f43abf" opacity="0.8"/>
  </g>

  <!-- Soft brand glow on LED hero -->
  <rect x="22.5" y="12.8" width="40" height="30.4" rx="2.8" fill="none" stroke="#26d8ff" stroke-width="0.55" opacity="0.35"/>
