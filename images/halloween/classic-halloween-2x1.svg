      <path d="M62 404C124 364 182 334 262 252" stroke-width="18"/>
      <path d="M112 120C152 80 204 58 302 28" stroke-width="12"/>
      <path d="M82 300C142 270 162 200 232 150" stroke-width="12"/>
      <path d="M70 524C130 502 172 472 236 470" stroke-width="12"/>
      <path d="M262 252l62-24M232 150l40-50M302 28l60-20M196 330l44 32M236 470l50 18M180 92l-10-46M150 280l-4-44" stroke-width="5"/>
      <path d="M50 640C20 610-10 600-40 600" stroke-width="14"/>
