        <path d="M20-18h28L34-44z"/>
        <path d="M-8 4h16L0-10z"/>
        <path d="M-58 16Q0 70 58 16l-12 7-8 12-10-10-12 14-10-12-10 12-10-12-10 12-10-12-10 8z"/>
      </g>
