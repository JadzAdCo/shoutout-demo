  <use href="#bat" xlink:href="#bat" transform="translate(1310 70) scale(.9)"/>
  <use href="#bat" xlink:href="#bat" transform="translate(520 14) scale(1.1)"/>
  <use href="#bat" xlink:href="#bat" transform="translate(1440 8) scale(.8)"/>
  <use href="#bat" xlink:href="#bat" transform="translate(180 12) scale(.75)"/>

  <path d="M0 600Q200 556 420 590T860 578T1300 566T1600 588V800H0z" fill="#100a1a"/>
  <g opacity=".85">
    <use href="#stone" xlink:href="#stone" x="340" y="520" width="80" height="140" transform="translate(-40 -70)"/>
    <use href="#cross" xlink:href="#cross" x="560" y="512" width="80" height="140" transform="translate(-40 -70)"/>
    <use href="#stone" xlink:href="#stone" x="1020" y="518" width="80" height="140" transform="translate(-40 -70)"/>
    <use href="#cross" xlink:href="#cross" x="1240" y="514" width="80" height="140" transform="translate(-40 -70)"/>
  </g>

  <use href="#tree" xlink:href="#tree"/>
  <use href="#tree" xlink:href="#tree" transform="translate(1600 0) scale(-1 1)"/>

  <path d="M0 650Q300 628 600 654T1200 644T1600 660V800H0z" fill="#07040b"/>
  <use href="#stone" xlink:href="#stone" x="232" y="676" width="96" height="168" transform="translate(-48 -84)"/>
  <use href="#cross" xlink:href="#cross" x="1372" y="672" width="96" height="168" transform="translate(-48 -84)"/>
  <use href="#stone" xlink:href="#stone" x="1270" y="700" width="80" height="140" transform="translate(-40 -70)"/>
  <use href="#cross" xlink:href="#cross" x="330" y="704" width="80" height="140" transform="translate(-40 -70)"/>

  <ellipse cx="800" cy="790" rx="900" ry="60" fill="url(#mist)"/>
  <ellipse cx="160" cy="770" rx="320" ry="50" fill="url(#mist)"/>
  <ellipse cx="1440" cy="770" rx="320" ry="50" fill="url(#mist)"/>

  <use href="#pumpkin" xlink:href="#pumpkin" x="104" y="722" width="150" height="135" transform="translate(-75 -75)"/>
  <use href="#pumpkin" xlink:href="#pumpkin" x="210" y="768" width="78" height="70" transform="translate(-39 -39)"/>
  <use href="#pumpkin" xlink:href="#pumpkin" x="1496" y="722" width="150" height="135" transform="translate(-75 -75)"/>
  <use href="#pumpkin" xlink:href="#pumpkin" x="1390" y="768" width="78" height="70" transform="translate(-39 -39)"/>
</svg>
