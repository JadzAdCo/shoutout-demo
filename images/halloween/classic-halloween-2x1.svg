      <text x="0" y="-8" text-anchor="middle" font-family="Georgia,serif" font-size="18" font-weight="700" fill="#5e546d">RIP</text>
      <path d="M-16 12h32M-12 24h24" stroke="#3b3346" stroke-width="3"/>
    </symbol>
    <symbol id="cross" viewBox="-40 -70 80 140" overflow="visible">
      <path d="M-6 64V-30h-22v-14h22v-22h12v22h22v14H6v94z" fill="#231d2a" stroke="#40384c" stroke-width="3"/>
    </symbol>
    <path id="bat" d="M30 10c-2-6-6-6-8-2-8-6-16-4-20-2 8 4 6 10 6 12 6-4 10-2 12 0 4-4 8-2 10 4 2-6 6-8 10-4 2-2 6-4 12 0 0-2-2-8 6-12-4-2-12-4-20 2-2-4-6-4-8 2z" fill="#030106"/>
    <g id="tree" fill="none" stroke="#030106" stroke-linecap="round">
