    <circle cx="720" cy="36" r="1.5"/><circle cx="860" cy="64" r="1.2"/><circle cx="980" cy="22" r="1.7"/><circle cx="1090" cy="80" r="1.1"/>
    <circle cx="1420" cy="30" r="1.6"/><circle cx="1530" cy="120" r="1.2"/><circle cx="1570" cy="40" r="1.4"/><circle cx="40" cy="150" r="1.3"/>
    <circle cx="560" cy="190" r="1"/><circle cx="780" cy="160" r="1.2"/><circle cx="1010" cy="200" r="1"/><circle cx="260" cy="210" r="1.1"/>
  </g>

  <circle cx="1210" cy="190" r="260" fill="url(#moonGlow)"/>
  <circle cx="1210" cy="190" r="112" fill="url(#moon)"/>
  <g fill="#d8c58f" opacity=".55">
