<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 800" width="1600" height="800" preserveAspectRatio="xMidYMax slice">
  <title>Classic Halloween — moonlit graveyard</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04020a"/>
      <stop offset=".55" stop-color="#140826"/>
      <stop offset=".8" stop-color="#26103a"/>
      <stop offset="1" stop-color="#170a1c"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff2c8" stop-opacity=".42"/>
      <stop offset=".45" stop-color="#ffb36b" stop-opacity=".14"/>
      <stop offset="1" stop-color="#7a3cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="40%" cy="38%" r="65%">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset=".7" stop-color="#f3e3b2"/>
      <stop offset="1" stop-color="#cdb57d"/>
    </radialGradient>
    <radialGradient id="pk" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffa53a"/>
      <stop offset=".55" stop-color="#e8600e"/>
      <stop offset="1" stop-color="#7c2604"/>
    </radialGradient>
    <radialGradient id="pkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff8a1c" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff8a1c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mist" cx="50%" cy="50%" r="50%">
