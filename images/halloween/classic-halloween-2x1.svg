      <path d="M-6-74C-6-92 6-98 16-92L8-68z" fill="#3c5b1c"/>
      <ellipse cx="-40" cy="0" rx="50" ry="70" fill="url(#pk)"/>
      <ellipse cx="40" cy="0" rx="50" ry="70" fill="url(#pk)"/>
      <ellipse cx="0" cy="0" rx="44" ry="74" fill="url(#pk)"/>
      <path d="M-22-66C-34-30-34 30-22 70M22-66C34-30 34 30 22 70" stroke="#8a2f06" stroke-width="3" fill="none" opacity=".7"/>
      <g fill="#ffd84a" filter="url(#glow)">
