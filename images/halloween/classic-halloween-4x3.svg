  <use href="#stone" xlink:href="#stone" x="178" y="768" width="84" height="148" transform="translate(-42 -74)"/>
  <use href="#cross" xlink:href="#cross" x="1022" y="764" width="84" height="148" transform="translate(-42 -74)"/>

