<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="VIP reserV">
  <defs>
    <linearGradient id="vipRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#26d8ff"/>
      <stop offset="55%" stop-color="#7a5cff"/>
      <stop offset="100%" stop-color="#ff4fc9"/>
    </linearGradient>
    <linearGradient id="vipTable" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#26d8ff"/>
      <stop offset="50%" stop-color="#7a5cff"/>
      <stop offset="100%" stop-color="#ff4fc9"/>
    </linearGradient>
    <linearGradient id="vipSeat" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#26d8ff"/>
      <stop offset="33%" stop-color="#7a5cff"/>
      <stop offset="66%" stop-color="#ff4fc9"/>
      <stop offset="100%" stop-color="#dfff5a"/>
    </linearGradient>
  </defs>

  <!-- Enlarged ring — fills most of the mark (wordmark moved inside) -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#vipRing)" stroke-width="2.6"/>

  <!-- VIP reserV above the table -->
  <text x="32" y="22.5" text-anchor="middle" fill="#fff"
        font-family="Arial Black, Helvetica Neue, Arial, sans-serif"
        font-size="7.2" font-weight="900" letter-spacing="0.04em">VIP reserV</text>

  <!-- Table (ellipse) -->
  <ellipse cx="32" cy="32.5" rx="17" ry="6.2" fill="url(#vipTable)" opacity="0.96"/>

  <!-- One curved banquette seat: top edge follows table curve, bottom edge straight -->
  <path d="M12.5 44.5
           L51.5 44.5
           L51.5 40.2
           C46.5 36.4, 39.5 34.2, 32 34.2
           C24.5 34.2, 17.5 36.4, 12.5 40.2
           Z"
        fill="url(#vipSeat)"/>
  <!-- Soft inner highlight along the curved table-facing edge -->
  <path d="M14.2 39.6
           C18.8 36.4, 25.0 34.8, 32 34.8
           C39.0 34.8, 45.2 36.4, 49.8 39.6"
        fill="none" stroke="#fff" stroke-width="0.7" opacity="0.28" stroke-linecap="round"/>
</svg>
