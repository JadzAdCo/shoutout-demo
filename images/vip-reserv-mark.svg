<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="VIP reserV">
  <defs>
    <linearGradient id="vipRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#26d8ff"/>
      <stop offset="55%" stop-color="#7a5cff"/>
      <stop offset="100%" stop-color="#ff4fc9"/>
    </linearGradient>
    <!-- Slight brownish red — table + seat (not rainbow) -->
    <linearGradient id="vipTable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9785c"/>
      <stop offset="55%" stop-color="#a85242"/>
      <stop offset="100%" stop-color="#8a3f36"/>
    </linearGradient>
    <linearGradient id="vipSeat" x1="0" y1="0.2" x2="1" y2="0.85">
      <stop offset="0%" stop-color="#b86852"/>
      <stop offset="45%" stop-color="#9a4a3c"/>
      <stop offset="100%" stop-color="#7a3830"/>
    </linearGradient>
    <linearGradient id="vipSeatShade" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.28"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30.2" fill="none" stroke="url(#vipRing)" stroke-width="2.7"/>

  <!-- VIP reserV — larger, lowered; letter V (not a check) -->
  <text x="32" y="20.5" text-anchor="middle" fill="#fff"
        font-family="Arial Black, Helvetica Neue, Arial, sans-serif"
        font-size="11.5" font-weight="900" letter-spacing="0.1em">VIP</text>
  <text x="32" y="31.2" text-anchor="middle"
        font-family="Arial Black, Helvetica Neue, Arial, sans-serif"
        font-size="10.5" font-weight="900" letter-spacing="0.02em">
    <tspan fill="#fff">reser</tspan><tspan fill="#dfff5a">V</tspan>
  </text>

  <!-- Table: straight outer (toward text), curved inner (toward seat); 2 glass spots -->
  <path d="M17.5 34.0
           L46.5 34.0
           L46.5 35.2
           C42.8 40.2, 37.6 42.6, 32 42.6
           C26.4 42.6, 21.2 40.2, 17.5 35.2
           Z"
        fill="url(#vipTable)"/>
  <!-- Two glass-holder spots -->
  <circle cx="25.2" cy="36.6" r="1.55" fill="#f4e8e0" opacity="0.95"/>
  <circle cx="25.2" cy="36.6" r="0.7" fill="#8a3f36" opacity="0.55"/>
  <circle cx="38.8" cy="36.6" r="1.55" fill="#f4e8e0" opacity="0.95"/>
  <circle cx="38.8" cy="36.6" r="0.7" fill="#8a3f36" opacity="0.55"/>

  <!-- Banquette: rear against ring; interior curve mirrors toward table -->
  <path d="M10.8 46.6
           C16.2 41.0, 23.4 38.0, 32 38.0
           C40.6 38.0, 47.8 41.0, 53.2 46.6
           C48.0 51.8, 40.4 55.0, 32 55.0
           C23.6 55.0, 16.0 51.8, 10.8 46.6
           Z"
        fill="url(#vipSeat)"/>
  <path d="M10.8 46.6
           C16.2 41.0, 23.4 38.0, 32 38.0
           C40.6 38.0, 47.8 41.0, 53.2 46.6
           C48.0 51.8, 40.4 55.0, 32 55.0
           C23.6 55.0, 16.0 51.8, 10.8 46.6
           Z"
        fill="url(#vipSeatShade)"/>
  <path d="M19.4 44.0 C19.9 47.0, 20.3 49.6, 20.7 52.4" fill="none" stroke="#3a1814" stroke-width="0.8" opacity="0.35" stroke-linecap="round"/>
  <path d="M26.0 41.2 C26.3 44.8, 26.6 48.4, 26.9 53.2" fill="none" stroke="#3a1814" stroke-width="0.8" opacity="0.35" stroke-linecap="round"/>
  <path d="M32.0 39.6 C32.0 44.0, 32.0 48.8, 32.0 53.8" fill="none" stroke="#3a1814" stroke-width="0.8" opacity="0.35" stroke-linecap="round"/>
  <path d="M38.0 41.2 C37.7 44.8, 37.4 48.4, 37.1 53.2" fill="none" stroke="#3a1814" stroke-width="0.8" opacity="0.35" stroke-linecap="round"/>
  <path d="M44.6 44.0 C44.1 47.0, 43.7 49.6, 43.3 52.4" fill="none" stroke="#3a1814" stroke-width="0.8" opacity="0.35" stroke-linecap="round"/>
  <path d="M12.6 45.8 C17.6 40.8, 24.2 38.8, 32 38.8 C39.8 38.8, 46.4 40.8, 51.4 45.8"
        fill="none" stroke="#f4e8e0" stroke-width="0.95" opacity="0.28" stroke-linecap="round"/>
</svg>
