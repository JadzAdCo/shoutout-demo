<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="VIP table">
  <defs>
    <linearGradient id="vipG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#26d8ff"/>
      <stop offset="55%" stop-color="#7a5cff"/>
      <stop offset="100%" stop-color="#ff4fc9"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#vipG)" stroke-width="2.5"/>
  <!-- table top -->
