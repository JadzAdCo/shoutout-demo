  <!-- seats -->
  <rect x="14" y="38" width="8" height="6" rx="2" fill="#26d8ff"/>
  <rect x="24" y="40" width="8" height="6" rx="2" fill="#7a5cff"/>
  <rect x="34" y="40" width="8" height="6" rx="2" fill="#ff4fc9"/>
  <rect x="44" y="38" width="8" height="6" rx="2" fill="#dfff5a"/>
