<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="VIP reserV">
  <defs>
    <linearGradient id="vipRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#26d8ff"/>
      <stop offset="55%" stop-color="#7a5cff"/>
      <stop offset="100%" stop-color="#ff4fc9"/>
    </linearGradient>
    <linearGradient id="vipTable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a5cff"/>
      <stop offset="100%" stop-color="#26d8ff"/>
    </linearGradient>
    <linearGradient id="vipSeat" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#26d8ff"/>
      <stop offset="28%" stop-color="#5b7cff"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="78%" stop-color="#ff4fc9"/>
      <stop offset="100%" stop-color="#dfff5a"/>
    </linearGradient>
    <linearGradient id="vipSeatShade" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.28"/>
    </linearGradient>
  </defs>

  <!-- Large ring (fills most of the mark) -->
  <circle cx="32" cy="32" r="30.2" fill="none" stroke="url(#vipRing)" stroke-width="2.7"/>

  <!-- VIP / reserV stacked (sketch); trailing V reads as a check -->
  <text x="32" y="16.2" text-anchor="middle" fill="#fff"
        font-family="Arial Black, Helvetica Neue, Arial, sans-serif"
        font-size="8.4" font-weight="900" letter-spacing="0.14em">VIP</text>
  <text x="29.2" y="24.4" text-anchor="middle" fill="#fff"
        font-family="Arial Black, Helvetica Neue, Arial, sans-serif"
        font-size="7.6" font-weight="900" letter-spacing="0.02em">reser</text>
  <!-- Checkmark-style V -->
  <path d="M40.2 18.8 L43.6 24.0 L49.2 16.6" fill="none" stroke="#dfff5a" stroke-width="2.35"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Crescent / half-moon table (sketch) with place-setting dots -->
  <path d="M16.5 34.8
           C18.2 28.6, 24.2 24.6, 32 24.6
           C39.8 24.6, 45.8 28.6, 47.5 34.8
           C43.8 32.2, 38.2 30.6, 32 30.6
           C25.8 30.6, 20.2 32.2, 16.5 34.8 Z"
        fill="url(#vipTable)"/>
  <circle cx="22.5" cy="30.2" r="1.15" fill="#fff" opacity="0.9"/>
  <circle cx="27.2" cy="28.6" r="1.15" fill="#fff" opacity="0.9"/>
  <circle cx="32.0" cy="28.0" r="1.15" fill="#fff" opacity="0.9"/>
  <circle cx="36.8" cy="28.6" r="1.15" fill="#fff" opacity="0.9"/>
  <circle cx="41.5" cy="30.2" r="1.15" fill="#fff" opacity="0.9"/>

  <!-- Natural banquette: curved toward table, straight outer edge, soft seat divisions -->
  <path d="M11.5 48.2
           L52.5 48.2
           L52.5 42.6
           C47.2 37.2, 40.0 34.4, 32 34.4
           C24.0 34.4, 16.8 37.2, 11.5 42.6
           Z"
        fill="url(#vipSeat)"/>
  <path d="M11.5 48.2
           L52.5 48.2
           L52.5 42.6
           C47.2 37.2, 40.0 34.4, 32 34.4
           C24.0 34.4, 16.8 37.2, 11.5 42.6
           Z"
        fill="url(#vipSeatShade)"/>
  <!-- Soft natural seat separators (not hard blocks) -->
  <path d="M19.6 43.0 C20.2 45.0, 20.4 46.4, 20.6 48.2" fill="none" stroke="#0a0e18" stroke-width="0.85" opacity="0.28" stroke-linecap="round"/>
  <path d="M26.0 40.8 C26.4 43.4, 26.6 45.6, 26.8 48.2" fill="none" stroke="#0a0e18" stroke-width="0.85" opacity="0.28" stroke-linecap="round"/>
  <path d="M32.0 39.8 C32.0 42.8, 32.0 45.4, 32.0 48.2" fill="none" stroke="#0a0e18" stroke-width="0.85" opacity="0.28" stroke-linecap="round"/>
  <path d="M38.0 40.8 C37.6 43.4, 37.4 45.6, 37.2 48.2" fill="none" stroke="#0a0e18" stroke-width="0.85" opacity="0.28" stroke-linecap="round"/>
  <path d="M44.4 43.0 C43.8 45.0, 43.6 46.4, 43.4 48.2" fill="none" stroke="#0a0e18" stroke-width="0.85" opacity="0.28" stroke-linecap="round"/>
  <!-- Table-facing cushion lip -->
  <path d="M13.2 42.2 C18.0 37.6, 24.6 35.2, 32 35.2 C39.4 35.2, 46.0 37.6, 50.8 42.2"
        fill="none" stroke="#fff" stroke-width="1.05" opacity="0.32" stroke-linecap="round"/>
</svg>
