<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="VIP reserV review — redder seat, black table">
  <!-- LOCAL REVIEW — preferred layout; seat toward red; table black -->
  <defs>
    <linearGradient id="vipRingR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#26d8ff"/>
      <stop offset="55%" stop-color="#7a5cff"/>
      <stop offset="100%" stop-color="#ff4fc9"/>
    </linearGradient>
    <!-- Black table (requested) -->
    <linearGradient id="vipTableR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="55%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <!-- Seat more toward red (site family, redder than brown) -->
