      <stop offset="0%" stop-color="#d04848"/>
      <stop offset="45%" stop-color="#b03030"/>
      <stop offset="100%" stop-color="#8a2222"/>
    </linearGradient>
    <linearGradient id="vipSeatShadeR" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.32"/>
    </linearGradient>
  </defs>

