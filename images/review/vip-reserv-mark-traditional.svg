<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 132" role="img" aria-label="VIP reserV traditional">
  <!-- LOCAL REVIEW  charcoal / white / black outline; VIP reserV unseparated below furniture -->
  <rect x="2" y="2" width="128" height="128" rx="26" fill="#2b2b2b" stroke="#000" stroke-width="4"/>
  <circle cx="66" cy="58" r="46" fill="none" stroke="#000" stroke-width="3.5"/>

  <defs>
    <linearGradient id="tradSeat" x1="0" y1="0.2" x2="1" y2="0.85">
      <stop offset="0%" stop-color="#d04848"/>
      <stop offset="45%" stop-color="#b03030"/>
      <stop offset="100%" stop-color="#8a2222"/>
    </linearGradient>
  </defs>

  <!-- Furniture only in upper/mid area (no top VIP text) -->
  <g transform="translate(66,54)">
    <path d="M-34 22
             C-38 8, -34 -10, -22 -22
             C-12 -32, -4 -36, 0 -36
             C4 -36, 12 -32, 22 -22
             C34 -10, 38 8, 34 22
             C28 16, 20 12, 14 10
             C24 0, 24 -12, 16 -20
             C8 -28, -8 -28, -16 -20
             C-24 -12, -24 0, -14 10
             C-20 12, -28 16, -34 22
             Z"
          fill="url(#tradSeat)" stroke="#000" stroke-width="1.2"/>
    <!-- flute lines -->
    <path d="M-24 -16 C-28 -2, -28 12, -22 22" fill="none" stroke="#3a1010" stroke-width="1.1" opacity="0.45"/>
    <path d="M-12 -26 C-14 -8, -14 10, -12 24" fill="none" stroke="#3a1010" stroke-width="1.1" opacity="0.4"/>
    <path d="M0 -28 C0 -8, 0 10, 0 26" fill="none" stroke="#3a1010" stroke-width="1.2" opacity="0.42"/>
    <path d="M12 -26 C14 -8, 14 10, 12 24" fill="none" stroke="#3a1010" stroke-width="1.1" opacity="0.4"/>
    <path d="M24 -16 C28 -2, 28 12, 22 22" fill="none" stroke="#3a1010" stroke-width="1.1" opacity="0.45"/>
    <!-- black table -->
    <circle cx="0" cy="2" r="12" fill="#0a0a0a" stroke="#000" stroke-width="1.5"/>
    <circle cx="-5" cy="-1" r="2" fill="#f0ece6"/>
    <circle cx="5" cy="-1" r="2" fill="#f0ece6"/>
    <!-- chairs -->
    <rect x="-30" y="24" width="12" height="9" rx="2" fill="#b03030" stroke="#000" stroke-width="1" transform="rotate(-16 -24 28)"/>
    <rect x="18" y="24" width="12" height="9" rx="2" fill="#b03030" stroke="#000" stroke-width="1" transform="rotate(16 24 28)"/>
  </g>

  <!-- Unseparated VIP reserV below furniture -->
  <text x="66" y="118" text-anchor="middle" fill="#fff"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="15" font-weight="700" letter-spacing="0.04em">VIP reserV</text>
</svg>
