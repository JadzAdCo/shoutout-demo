<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" preserveAspectRatio="xMidYMid slice">
  <title>AMERICAN EXPRESS Black Card (private)</title>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a1c"/>
      <stop offset=".35" stop-color="#0a0a0b"/>
      <stop offset=".7" stop-color="#121214"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f5f7"/>
      <stop offset=".45" stop-color="#c8c8ce"/>
      <stop offset="1" stop-color="#8e8e96"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1c2"/>
      <stop offset=".22" stop-color="#e8c872"/>
      <stop offset=".5" stop-color="#c9a227"/>
      <stop offset=".78" stop-color="#8a6814"/>
      <stop offset="1" stop-color="#f0d78a"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e7b0"/>
      <stop offset=".5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#9a7420"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8e4d8"/>
      <stop offset=".5" stop-color="#b7a878"/>
      <stop offset="1" stop-color="#7a6a3a"/>
    </linearGradient>
    <pattern id="micro" width="110" height="14" patternUnits="userSpaceOnUse">
      <text x="0" y="11" font-family="Arial,Helvetica,sans-serif" font-size="7" fill="#2a2a2e" letter-spacing="1">AMERICAN EXPRESS</text>
    </pattern>
    <pattern id="filigree" width="36" height="13" patternUnits="userSpaceOnUse">
      <path d="M2,7.15 C6.4799999999999995,1.3 11.52,12.35 18,6.5
               C24.48,0.65 29.52,11.700000000000001 34,5.8500000000000005"
            fill="none" stroke="url(#goldSoft)" stroke-width="1.15" opacity=".95"/>
      <circle cx="18" cy="6.5" r="1.15" fill="url(#gold)"/>
      <path d="M7.92,6.5 Q18,1.95 28.080000000000002,6.5"
            fill="none" stroke="#f5e6b0" stroke-width="0.7" opacity=".55"/>
    </pattern>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="0.6" flood-color="#000" flood-opacity=".55"/>
      <feDropShadow dx="0" dy="-0.6" stdDeviation="0.4" flood-color="#fff" flood-opacity=".18"/>
    </filter>
    <filter id="goldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#d4af37" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1600" height="800" rx="48" fill="url(#metal)"/>
  <rect width="1600" height="800" rx="48" fill="url(#micro)" opacity=".55"/>

  <!-- Gold rim (outer edge of the metal plate) -->
  <rect x="5.5" y="5.5" width="1589" height="789"
        rx="46" fill="none" stroke="url(#gold)" stroke-width="11" filter="url(#goldGlow)"/>

  <!-- Ornate gold filigree band -->
  <rect x="27" y="27" width="1546" height="746"
        rx="38" fill="none" stroke="url(#filigree)" stroke-width="17.599999999999998"/>
  <rect x="27" y="27" width="1546" height="746"
        rx="38" fill="none" stroke="url(#gold)" stroke-width="7.199999999999999" opacity=".95"/>

  <!-- Mid + inner gold rules -->
  <rect x="37" y="37" width="1526" height="726"
        rx="30" fill="none" stroke="url(#goldSoft)" stroke-width="4.3999999999999995" opacity=".85"/>
  <rect x="48" y="48" width="1504" height="704"
        rx="24" fill="none" stroke="url(#gold)" stroke-width="3.2" opacity=".7"/>

  <!-- Corner flourishes -->
  <g fill="none" stroke="url(#gold)" stroke-width="2.8000000000000003" stroke-linecap="round" opacity=".95">
    <path d="M0,48.400000000000006 C7.04,48.400000000000006 15.84,42.239999999999995 19.36,30.799999999999997 C24.64,15.84 36.96,8.8 48.400000000000006,8.8 M10.559999999999999,36.96 C17.6,36.96 24.64,29.92 26.4,22.880000000000003 C29.92,14.08 36.96,12.32 44,12.32 M7.04,24.64 Q15.84,7.04 33.44,7.04 M1.76,15.84 Q10.559999999999999,1.76 24.64,1.76" transform="translate(29,29)"/>
    <path d="M0,48.400000000000006 C7.04,48.400000000000006 15.84,42.239999999999995 19.36,30.799999999999997 C24.64,15.84 36.96,8.8 48.400000000000006,8.8 M10.559999999999999,36.96 C17.6,36.96 24.64,29.92 26.4,22.880000000000003 C29.92,14.08 36.96,12.32 44,12.32 M7.04,24.64 Q15.84,7.04 33.44,7.04 M1.76,15.84 Q10.559999999999999,1.76 24.64,1.76" transform="translate(1571,29) scale(-1,1)"/>
    <path d="M0,48.400000000000006 C7.04,48.400000000000006 15.84,42.239999999999995 19.36,30.799999999999997 C24.64,15.84 36.96,8.8 48.400000000000006,8.8 M10.559999999999999,36.96 C17.6,36.96 24.64,29.92 26.4,22.880000000000003 C29.92,14.08 36.96,12.32 44,12.32 M7.04,24.64 Q15.84,7.04 33.44,7.04 M1.76,15.84 Q10.559999999999999,1.76 24.64,1.76" transform="translate(29,771) scale(1,-1)"/>
    <path d="M0,48.400000000000006 C7.04,48.400000000000006 15.84,42.239999999999995 19.36,30.799999999999997 C24.64,15.84 36.96,8.8 48.400000000000006,8.8 M10.559999999999999,36.96 C17.6,36.96 24.64,29.92 26.4,22.880000000000003 C29.92,14.08 36.96,12.32 44,12.32 M7.04,24.64 Q15.84,7.04 33.44,7.04 M1.76,15.84 Q10.559999999999999,1.76 24.64,1.76" transform="translate(1571,771) scale(-1,-1)"/>
  </g>

  <circle cx="272" cy="224.00000000000003" r="88" fill="#0d0d10" stroke="url(#gold)" stroke-width="8"/>
  <circle cx="272" cy="224.00000000000003" r="80.96000000000001" fill="#151518" stroke="#8a6814" stroke-width="1" opacity=".85"/>
  
  <g transform="translate(272,224.00000000000003)" fill="url(#silver)" opacity=".9">
    <ellipse cx="0" cy="8" rx="33.44" ry="42.239999999999995"/>
    <path d="M-36.96,-4.4 Q0,-66 36.96,-4.4 L24.64,13.2 Q0,-13.2 -24.64,13.2 Z"/>
    <path d="M-7.04,-48.400000000000006 L0,-74.8 L7.04,-48.400000000000006 Z" opacity=".85"/>
  </g>
  

  <g transform="translate(223.6, 325.20000000000005)">
    <rect width="96.80000000000001" height="74.8" rx="4" fill="url(#chip)" stroke="#5a4a28" stroke-width="1"/>
    <path d="M13.2,0 V74.8 M48.400000000000006,0 V74.8 M83.6,0 V74.8 M0,24.64 H96.80000000000001 M0,48.400000000000006 H96.80000000000001" stroke="#4a3a18" stroke-width="1" opacity=".55"/>
  </g>

  <g transform="translate(832,128)" filter="url(#emboss)">
    <text x="0" y="0" font-family="Arial Black,Impact,Arial,sans-serif" font-size="40" fill="url(#silver)" letter-spacing="4.8">AMERICAN EXPRESS</text>
    <text x="0" y="76" font-family="Georgia,'Times New Roman',serif" font-size="88" fill="url(#silver)" letter-spacing="19.2" font-weight="700">BUSINESS</text>
  </g>

  <text x="192" y="496" font-family="'Courier New',Courier,monospace" font-size="68" fill="url(#silver)" letter-spacing="9.6" filter="url(#emboss)">8721  448291  55021</text>
  <text x="1248" y="496" font-family="'Courier New',Courier,monospace" font-size="36" fill="#a8a8b0">9042</text>

  <g fill="url(#silver)" font-family="Arial,Helvetica,sans-serif">
    <text x="192" y="576" font-size="22" fill="#8a8a92" letter-spacing="1">Valid Thru</text>
    <text x="192" y="628" font-size="44" font-family="'Courier New',Courier,monospace" filter="url(#emboss)">02/28</text>
    <text x="672" y="576" font-size="22" fill="#8a8a92" letter-spacing="1">Member Since</text>
    <text x="672" y="628" font-size="44" font-family="'Courier New',Courier,monospace" filter="url(#emboss)">05</text>
  </g>

  <text x="192" y="704" font-family="Arial,Helvetica,sans-serif" font-size="36" fill="#3a3a40" letter-spacing="2" class="baller-name-guide">CARDHOLDER NAME</text>
  <text x="192" y="752" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#2e2e34" letter-spacing="1" class="baller-company-guide">COMPANY</text>

  <text x="800" y="787.85" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#4a4a52">© AMERICAN EXPRESS · FLOQR PRIVATE PREVIEW</text>
</svg>
