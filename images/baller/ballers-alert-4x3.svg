<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice">
  <title>BALLER'S EXPRESS Baller's Alert</title>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a1c"/>
      <stop offset=".35" stop-color="#0a0a0b"/>
      <stop offset=".7" stop-color="#121214"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f5f7"/>
      <stop offset=".45" stop-color="#c8c8ce"/>
      <stop offset="1" stop-color="#8e8e96"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1c2"/>
      <stop offset=".22" stop-color="#e8c872"/>
      <stop offset=".5" stop-color="#c9a227"/>
      <stop offset=".78" stop-color="#8a6814"/>
      <stop offset="1" stop-color="#f0d78a"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e7b0"/>
      <stop offset=".5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#9a7420"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8e4d8"/>
      <stop offset=".5" stop-color="#b7a878"/>
      <stop offset="1" stop-color="#7a6a3a"/>
    </linearGradient>
    <pattern id="micro" width="110" height="14" patternUnits="userSpaceOnUse">
      <text x="0" y="11" font-family="Arial,Helvetica,sans-serif" font-size="7" fill="#2a2a2e" letter-spacing="1">BALLER'S EXPRESS</text>
    </pattern>
    <pattern id="filigree" width="41" height="14" patternUnits="userSpaceOnUse">
      <path d="M2,7.700000000000001 C7.38,1.4000000000000001 13.120000000000001,13.299999999999999 20.5,7
               C27.880000000000003,0.7000000000000001 33.62,12.6 39,6.3"
            fill="none" stroke="url(#goldSoft)" stroke-width="1.15" opacity=".95"/>
      <circle cx="20.5" cy="7" r="1.15" fill="url(#gold)"/>
      <path d="M9.02,7 Q20.5,2.1 31.98,7"
            fill="none" stroke="#f5e6b0" stroke-width="0.7" opacity=".55"/>
    </pattern>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="0.6" flood-color="#000" flood-opacity=".55"/>
      <feDropShadow dx="0" dy="-0.6" stdDeviation="0.4" flood-color="#fff" flood-opacity=".18"/>
    </filter>
    <filter id="goldGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#d4af37" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="900" rx="54" fill="url(#metal)"/>
  <rect width="1200" height="900" rx="54" fill="url(#micro)" opacity=".55"/>

  <!-- Gold rim (outer edge of the metal plate) -->
  <rect x="6.5" y="6.5" width="1187" height="887"
        rx="52" fill="none" stroke="url(#gold)" stroke-width="13" filter="url(#goldGlow)"/>

  <!-- Ornate gold filigree band -->
  <rect x="31" y="31" width="1138" height="838"
        rx="43" fill="none" stroke="url(#filigree)" stroke-width="19.799999999999997"/>
  <rect x="31" y="31" width="1138" height="838"
        rx="43" fill="none" stroke="url(#gold)" stroke-width="8.1" opacity=".95"/>

  <!-- Mid + inner gold rules -->
  <rect x="42" y="42" width="1116" height="816"
        rx="34" fill="none" stroke="url(#goldSoft)" stroke-width="4.949999999999999" opacity=".85"/>
  <rect x="55" y="55" width="1090" height="790"
        rx="27" fill="none" stroke="url(#gold)" stroke-width="3.6" opacity=".7"/>

  <!-- Corner flourishes -->
  <g fill="none" stroke="url(#gold)" stroke-width="3.15" stroke-linecap="round" opacity=".95">
    <path d="M0,54.45 C7.92,54.45 17.82,47.519999999999996 21.78,34.65 C27.720000000000002,17.82 41.58,9.9 54.45,9.9 M11.879999999999999,41.58 C19.8,41.58 27.720000000000002,33.660000000000004 29.7,25.740000000000002 C33.660000000000004,15.84 41.58,13.860000000000001 49.5,13.860000000000001 M7.92,27.720000000000002 Q17.82,7.92 37.62,7.92 M1.98,17.82 Q11.879999999999999,1.98 27.720000000000002,1.98" transform="translate(33,33)"/>
    <path d="M0,54.45 C7.92,54.45 17.82,47.519999999999996 21.78,34.65 C27.720000000000002,17.82 41.58,9.9 54.45,9.9 M11.879999999999999,41.58 C19.8,41.58 27.720000000000002,33.660000000000004 29.7,25.740000000000002 C33.660000000000004,15.84 41.58,13.860000000000001 49.5,13.860000000000001 M7.92,27.720000000000002 Q17.82,7.92 37.62,7.92 M1.98,17.82 Q11.879999999999999,1.98 27.720000000000002,1.98" transform="translate(1167,33) scale(-1,1)"/>
    <path d="M0,54.45 C7.92,54.45 17.82,47.519999999999996 21.78,34.65 C27.720000000000002,17.82 41.58,9.9 54.45,9.9 M11.879999999999999,41.58 C19.8,41.58 27.720000000000002,33.660000000000004 29.7,25.740000000000002 C33.660000000000004,15.84 41.58,13.860000000000001 49.5,13.860000000000001 M7.92,27.720000000000002 Q17.82,7.92 37.62,7.92 M1.98,17.82 Q11.879999999999999,1.98 27.720000000000002,1.98" transform="translate(33,867) scale(1,-1)"/>
    <path d="M0,54.45 C7.92,54.45 17.82,47.519999999999996 21.78,34.65 C27.720000000000002,17.82 41.58,9.9 54.45,9.9 M11.879999999999999,41.58 C19.8,41.58 27.720000000000002,33.660000000000004 29.7,25.740000000000002 C33.660000000000004,15.84 41.58,13.860000000000001 49.5,13.860000000000001 M7.92,27.720000000000002 Q17.82,7.92 37.62,7.92 M1.98,17.82 Q11.879999999999999,1.98 27.720000000000002,1.98" transform="translate(1167,867) scale(-1,-1)"/>
  </g>

  <circle cx="204.00000000000003" cy="252.00000000000003" r="144" fill="#0d0d10" stroke="url(#gold)" stroke-width="9"/>
  <circle cx="204.00000000000003" cy="252.00000000000003" r="132.48000000000002" fill="#151518" stroke="#8a6814" stroke-width="1" opacity=".85"/>
  
  <circle cx="204.00000000000003" cy="252.00000000000003" r="126.72" fill="#1c1c22" class="baller-face-hole"/>
  <text x="204.00000000000003" y="262.8" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#6a6a72">FACE</text>
  

  <g transform="translate(124.80000000000003, 417.6)">
    <rect width="158.4" height="122.39999999999999" rx="4" fill="url(#chip)" stroke="#5a4a28" stroke-width="1"/>
    <path d="M21.599999999999998,0 V122.39999999999999 M79.2,0 V122.39999999999999 M136.79999999999998,0 V122.39999999999999 M0,40.32000000000001 H158.4 M0,79.2 H158.4" stroke="#4a3a18" stroke-width="1" opacity=".55"/>
  </g>

  <g transform="translate(504,144)" filter="url(#emboss)">
    <text x="0" y="0" font-family="Arial Black,Impact,Arial,sans-serif" font-size="50" fill="url(#silver)" letter-spacing="3.6">BALLER'S EXPRESS</text>
    <text x="0" y="86" font-family="Georgia,'Times New Roman',serif" font-size="99" fill="url(#silver)" letter-spacing="14.4" font-weight="700">BUSINESS</text>
  </g>

  <text x="144" y="558" font-family="'Courier New',Courier,monospace" font-size="77" fill="url(#silver)" letter-spacing="7.2" filter="url(#emboss)">8721  448291  55021</text>
  <text x="936" y="558" font-family="'Courier New',Courier,monospace" font-size="41" fill="#a8a8b0">9042</text>

  <g fill="url(#silver)" font-family="Arial,Helvetica,sans-serif">
    <text x="144" y="648" font-size="25" fill="#8a8a92" letter-spacing="1">Valid Thru</text>
    <text x="144" y="706.5" font-size="50" font-family="'Courier New',Courier,monospace" filter="url(#emboss)">02/50</text>
    <text x="504" y="648" font-size="25" fill="#8a8a92" letter-spacing="1">Member Since</text>
    <text x="504" y="706.5" font-size="50" font-family="'Courier New',Courier,monospace" filter="url(#emboss)">05</text>
  </g>

  <text x="144" y="792" font-family="Arial,Helvetica,sans-serif" font-size="41" fill="#3a3a40" letter-spacing="2" class="baller-name-guide">CARDHOLDER NAME</text>
  <text x="144" y="846" font-family="Arial,Helvetica,sans-serif" font-size="32" fill="#2e2e34" letter-spacing="1" class="baller-company-guide">COMPANY</text>

  <text x="600" y="886.05" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#4a4a52">© BALLER'S EXPRESS · FLOQR SHOUTOUT</text>
</svg>
