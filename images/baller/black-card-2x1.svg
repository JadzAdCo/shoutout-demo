  <circle cx="272" cy="224.00000000000003" r="88" fill="#0d0d10" stroke="url(#silver)" stroke-width="8"/>
  <circle cx="272" cy="224.00000000000003" r="80.96000000000001" fill="#151518" stroke="#3a3a40" stroke-width="1"/>
  
  <g transform="translate(272,224.00000000000003)" fill="url(#silver)" opacity=".9">
