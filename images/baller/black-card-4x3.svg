  <rect x="41" y="41" width="1118" height="818"
        rx="32" fill="none" stroke="#6a6a72" stroke-width="1" opacity=".7"/>

  <circle cx="204.00000000000003" cy="252.00000000000003" r="99" fill="#0d0d10" stroke="url(#silver)" stroke-width="9"/>
  <circle cx="204.00000000000003" cy="252.00000000000003" r="91.08" fill="#151518" stroke="#3a3a40" stroke-width="1"/>
  
  <g transform="translate(204.00000000000003,252.00000000000003)" fill="url(#silver)" opacity=".9">
    <ellipse cx="0" cy="8" rx="37.62" ry="47.519999999999996"/>
    <path d="M-41.58,-4.95 Q0,-74.25 41.58,-4.95 L27.720000000000002,14.85 Q0,-14.85 -27.720000000000002,14.85 Z"/>
    <path d="M-7.92,-54.45 L0,-84.14999999999999 L7.92,-54.45 Z" opacity=".85"/>
  </g>
  

