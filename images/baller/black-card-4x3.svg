    <path d="M14.85,0 V84.14999999999999 M54.45,0 V84.14999999999999 M94.05,0 V84.14999999999999 M0,27.720000000000002 H108.9 M0,54.45 H108.9" stroke="#4a3a18" stroke-width="1" opacity=".55"/>
  </g>

  <g transform="translate(624,144)" filter="url(#emboss)">
