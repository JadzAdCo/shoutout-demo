<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Door pass | FloqR</title>
  <link rel="stylesheet" href="./styles.css?v=s3.2.36"/>
  <script>
    try{
      var __floqrChromeMap={0:"nightlife",1:"traditional",2:"blackTiffany",3:"whiteBlack",4:"purpleWhite",5:"blackDarkGreen"};
      var __floqrChromeRaw=localStorage.getItem("floqr.isSiteChrome");
      var __floqrChrome=__floqrChromeMap[__floqrChromeRaw];
      if(!__floqrChrome){
        var __legacy=String(localStorage.getItem("floqr.uiChrome")||"").trim();
        if(__legacy==="traditional"||__legacy==="nightlife"||__legacy==="blackTiffany"||__legacy==="whiteBlack"||__legacy==="blackDarkGreen"||__legacy==="purpleWhite") __floqrChrome=__legacy;
      }
      if(__floqrChrome){
        document.documentElement.setAttribute("data-floqr-chrome",__floqrChrome);
        document.documentElement.setAttribute("data-is-site-chrome",String(__floqrChromeRaw!=null&&__floqrChromeRaw!==""?__floqrChromeRaw:({nightlife:0,traditional:1,blackTiffany:2,whiteBlack:3,purpleWhite:4,blackDarkGreen:5})[__floqrChrome]));
      }
    }catch(_){}
  </script>
  <style>
    .pass-shell{max-width:420px;margin:0 auto;padding:24px 16px 48px;text-align:center}
    .pass-shell h1{font-size:clamp(1.5rem,5vw,2rem);margin:8px 0 4px}
    .pass-meta{color:var(--muted);margin:0 0 18px;line-height:1.4}
    .floqr-qr{display:grid;place-items:center;margin:18px auto;padding:14px;background:#fff;border-radius:16px;width:fit-content;min-width:200px;min-height:200px;color:#111}
    .pass-token{font-size:12px;word-break:break-all;color:var(--muted);margin-top:12px}
  </style>
</head>
<body>
  <a id="floqrGlobalBack" class="global-back-btn buttonlike" data-from="portal" href="./patron-portal.html?tab=passes">&lt; Back</a>
  <main class="app pass-shell">
    <a href="./?start=search" class="floqr-home-link" data-floqr-home-logo aria-label="FloqR home">
      <img src="./images/floqr-color.png?v=s3.2.36" alt="FloqR" class="product-parent-logo" data-floqr-brand-logo width="180"/>
    </a>
    <p class="eyebrow">FloqR · Door pass</p>
    <h1 id="passTitle">Door pass</h1>
    <p id="passMeta" class="pass-meta">Loading pass…</p>
    <div id="passQr" class="floqr-qr" aria-label="Pass QR code"></div>
    <p id="passToken" class="pass-token"></p>
    <p id="passStatus" class="status" aria-live="polite"></p>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script>
  <script src="./firebase-config.js?v=s3.2.36"></script>
  <script src="./floqr-chrome-scheme.js?v=s3.2.36"></script>
  <script src="./floqr-chrome-audit.js?v=s3.2.36"></script>
  <script src="./floqr-nav.js?v=s3.2.36"></script>
  <script src="./floqr-qrcode-lib.js?v=s3.2.36"></script>
  <script src="./floqr-qr.js?v=s3.2.36"></script>
  <script src="./pass-app.js?v=s3.2.36"></script>
</body>
</html>
