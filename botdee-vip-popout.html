<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="robots" content="noindex,nofollow"/>
  <meta name="referrer" content="no-referrer"/>
  <title>VIP reserV</title>
  <link rel="stylesheet" href="./styles.css?v=s3.3.082"/>
  <link rel="stylesheet" href="./bot-dee-chat.css?v=s3.3.082"/>
  <link rel="stylesheet" href="./botdee-smartview.css?v=s3.3.082"/>
  <link rel="stylesheet" href="./vip-floor-viewer.css?v=s3.3.082"/>
</head>
<body class="botdee-vip-popout-page" data-floqr-public>
<main class="botdee-vip-popout">
  <div class="botdee-photo-popout-bar">
    <button type="button" id="botDeeVipX" class="botdee-photo-popout-x" aria-label="Close">×</button>
    <button type="button" id="botDeeVipClose" class="botdee-photo-popout-close">Close</button>
  </div>
  <div id="botDeeVipBody" class="botdee-vip-popout-body"></div>
  <section id="botDeeVipMapSection" class="vip-map-section botdee-vip-map-section" hidden>
    <nav class="chips" id="chips" role="tablist" aria-label="Areas"></nav>
    <div class="layout vip-map-layout">
      <div class="map-col">
        <div class="legend" id="legend" aria-label="Map legend"></div>
        <div class="stage-wrap">
          <div class="stage" id="stage">
            <svg class="map" id="map" role="group" aria-label="Floor map"></svg>
          </div>
          <div class="tools">
            <svg class="minimap" id="minimap" role="img" aria-label="Overview of the whole room — tap to move there" hidden></svg>
            <div class="zoom">
              <button type="button" id="zin" aria-label="Zoom in">+</button>
              <button type="button" id="zout" aria-label="Zoom out">−</button>
              <button type="button" id="zfit" aria-label="Fit area">⤢</button>
            </div>
          </div>
        </div>
        <ul class="list" id="list" aria-label="Tables"></ul>
      </div>
      <aside class="info vip-table-popout" id="info" aria-live="polite" hidden></aside>
    </div>
    <div id="vipTablePopoutBackdrop" class="vip-table-popout-backdrop hidden" hidden aria-hidden="true"></div>
  </section>
  <p id="botDeeVipStatus" class="botdee-photo-popout-status" role="status"></p>
</main>
<script>window.FLOQR_VIP_SKIP_BOOT = true;</script>
<script src="./vip-floor-viewer.js?v=s3.3.082"></script>
<script>
(function () {
  "use strict";

  var PLAN_BY_ID = {
    "temp-democlub-1": "aurelia.json",
    "decades-washington-dc": "decades.json",
    "lima-twist-washington-dc": "lima-twist.json",
    "shoko-barcelona-spain": "shoko-barcelona.json"
  };

  function params() {
    try { return new URLSearchParams(location.search); } catch (_) { return new URLSearchParams(); }
  }

  function readJson(raw) {
    try { return JSON.parse(raw || "null"); } catch (_) { return null; }
  }

  function readPayload() {
    try {
      if (window.opener && window.opener.__floqrBotDeeVipPopout) return window.opener.__floqrBotDeeVipPopout;
    } catch (_) {}
    try {
      var live = readJson(sessionStorage.getItem("floqr.botdeeVipPopout"));
      if (live) return live;
    } catch (_) {}
    try {
      return readJson(localStorage.getItem("floqr.botdeeVipPopout"));
    } catch (_) {}
    return null;
  }

  function post(kind, extra) {
    var message = Object.assign({source: "floqr-botdee-vip", kind: kind}, extra || {});
    try {
      if (window.opener && !window.opener.closed) window.opener.postMessage(message, location.origin);
    } catch (_) {}
  }

  function closePopout() {
    try { window.close(); } catch (_) {}
    statusEl.textContent = "You can close this window to return to BOT DEE.";
  }

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function planFileFor(clubLocationId, explicit) {
    var named = String(explicit || "").trim().replace(/^.*\//, "");
    if (/\.json$/i.test(named)) return named;
    var id = String(clubLocationId || "").trim();
    if (PLAN_BY_ID[id]) return PLAN_BY_ID[id];
    if (/aurelia/i.test(id)) return "aurelia.json";
    return "";
  }

  function liveStates(map) {
    var states = {};
    var tables = map && Array.isArray(map.tables) ? map.tables : [];
    tables.forEach(function (table) {
      if (table && table.id) states[table.id] = String(table.status || "available");
    });
    return states;
  }

  var q = params();
  var kind = String(q.get("kind") || "").trim();
  var payload = readPayload() || {};
  var view = payload.view && typeof payload.view === "object" ? payload.view : {};
  var labels = payload.labels && typeof payload.labels === "object" ? payload.labels : {};
  if (!kind) kind = String(payload.kind || "map");
  var body = document.getElementById("botDeeVipBody");
  var mapSection = document.getElementById("botDeeVipMapSection");
  var statusEl = document.getElementById("botDeeVipStatus");
  var closeBtn = document.getElementById("botDeeVipClose");
  var xBtn = document.getElementById("botDeeVipX");
  closeBtn.textContent = labels.close || "Close";
  closeBtn.setAttribute("aria-label", labels.close || "Close");
  xBtn.setAttribute("aria-label", labels.close || "Close");
  closeBtn.addEventListener("click", closePopout);
  xBtn.addEventListener("click", closePopout);
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") { event.preventDefault(); closePopout(); }
  });

  if (kind === "paid" || kind === "pass") {
    document.title = labels.pass || "Your VIP reserV pass";
    var table = view.sectionLabel || view.sectionId || "";
    var venue = view.venueName || "";
    body.innerHTML = "<h1>" + esc(labels.pass || "Your VIP reserV pass") + "</h1>" +
      '<p class="botdee-vip-popout-pass">' + esc((table ? table + " · " : "") + venue) + "</p>" +
      "<p>Show this at the door. This window is still part of your BOT DEE session.</p>";
    statusEl.textContent = q.get("order") ? ("Order " + q.get("order")) : "";
    post("paid", {orderId: q.get("order") || "", reservationId: q.get("reservationId") || view.reservationId || ""});
    return;
  }

  if (kind === "payCancel") {
    document.title = labels.pay || "VIP reserV";
    body.innerHTML = "<h1>Payment cancelled</h1><p>Return to BOT DEE to keep the hold or tap Cancel hold.</p>";
    post("payCancel", {orderId: q.get("order") || ""});
    return;
  }

  if (kind === "terms") {
    document.title = labels.terms || view.termsTitle || "VIP reserV Terms";
    body.innerHTML = "<h1>" + esc(view.termsTitle || labels.terms || "VIP reserV Terms") + "</h1>" +
      '<p class="botdee-vip-popout-terms">' + esc(view.termsSummary || "I agree records VIP Terms consent and opens Stripe in a pop-out. BOT DEE never takes card numbers. Legal Terms stay in English until counsel approves other languages.") + "</p>" +
      "<p>Legal Terms of use stay in English. Chrome on the dock is translated.</p>" +
      '<button type="button" class="botdee-sv-action botdee-sv-action-main" data-vip-prompt="I agree">' +
      esc("I agree") + "</button>";
    body.querySelectorAll("[data-vip-prompt]").forEach(function (btn) {
      btn.addEventListener("click", function (event) {
        event.preventDefault();
        if (btn.disabled) return;
        post("prompt", {prompt: btn.getAttribute("data-vip-prompt") || ""});
        closePopout();
      });
    });
    return;
  }

  document.title = labels.map || "VIP reserV map";
  var locationId = String(q.get("location") || view.clubLocationId || "").trim();
  var planFile = planFileFor(locationId, q.get("plan") || view.planFile || (view.map && view.map.planFile));
  var area = String(q.get("area") || view.map && view.map.selectedAreaId || "").trim();
  var sel = String(q.get("sel") || view.sectionId || "").trim();
  var guest = view.guestMode === true || q.get("guest") === "1";
  body.innerHTML = "<h1>" + esc(labels.map || "VIP reserV map") + "</h1>";
  if (!planFile) {
    statusEl.textContent = "Could not load the VIP reserV floor map.";
    return;
  }
  mapSection.hidden = false;
  var viewer = window.FLOQRVipFloorViewer;
  if (!viewer || typeof viewer.load !== "function") {
    statusEl.textContent = "Could not load the VIP reserV floor map.";
    return;
  }
  if (!guest) {
    viewer.onSelect = function (payload) {
      var item = payload && payload.item;
      if (!item || item.bookable === false) return;
      post("prompt", {prompt: item.label || item.id || ""});
      closePopout();
    };
  }
  viewer.load(planFile, area, sel).then(function () {
    var states = liveStates(view.mapFull || view.map);
    if (Object.keys(states).length) viewer.setStates(states);
    var loaded = viewer.getPlan && viewer.getPlan();
    if (!loaded) statusEl.textContent = "Could not load " + planFile + ".";
  }).catch(function () {
    statusEl.textContent = "Could not load " + planFile + ".";
  });
})();
</script>
</body>
</html>
