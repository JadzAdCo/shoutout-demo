<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>SMARTview headless</title>
  <script>
    try{
      var __floqrChromeMap={0:"nightlife",1:"traditional",2:"blackTiffany",3:"whiteBlack",4:"purpleWhite",5:"blackDarkGreen"};
      var __floqrChromeRaw=localStorage.getItem("floqr.isSiteChrome");
      var __floqrChrome=__floqrChromeMap[__floqrChromeRaw];
      if(!__floqrChrome){
        var __legacy=String(localStorage.getItem("floqr.uiChrome")||"").trim();
        if(__legacy==="traditional"||__legacy==="nightlife"||__legacy==="blackTiffany"||__legacy==="whiteBlack"||__legacy==="blackDarkGreen"||__legacy==="purpleWhite") __floqrChrome=__legacy;
      }
      if(!__floqrChrome) __floqrChrome="nightlife";
      var __shot=new URLSearchParams(location.search).get("chrome");
      if(__shot) __floqrChrome=__shot;
      document.documentElement.setAttribute("data-floqr-chrome",__floqrChrome);
    }catch(_){}
  </script>
  <link rel="stylesheet" href="./styles.css?v=s3.3.075"/>
  <link rel="stylesheet" href="./botdee-smartview.css?v=s3.3.075"/>
  <link rel="preload" href="./smartvisuals/catalog.json" as="fetch" crossorigin="anonymous"/>
  <style>
    body {
      margin: 0 auto;
      max-width: 430px;
      padding: 12px 14px calc(24px + env(safe-area-inset-bottom));
      background: var(--floqr-ink, #05080a);
      color: var(--text, #f4fbff);
    }
    .svh-note { font-size: 12px; opacity: 0.78; margin: 0 0 10px; line-height: 1.4; }
    .svh-title { margin: 0 0 6px; font-size: 1.15rem; }
    .svh-form { display: flex; flex-direction: column; gap: 8px; margin: 0 0 12px; }
    .svh-form textarea {
      min-height: 96px;
      border-radius: 14px;
      padding: 12px 14px;
      resize: vertical;
    }
    .svh-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .svh-actions .buttonlike { min-height: 44px; flex: 1 1 140px; }
    .svh-host { display: flex; flex-direction: column; gap: 8px; }
    .svh-host .botdee-sv-place { margin: 0; }
    .svh-status { font-size: 12px; margin: 0 0 10px; min-height: 1.2em; }
    html[data-shot] .svh-note,
    html[data-shot] .svh-form { display: none; }
    html[data-mode="headless"] .svh-form { display: none; }
  </style>
</head>
<body class="botdee-page" data-floqr-public data-floqr-chrome="nightlife">
  <h1 class="svh-title">SMARTview</h1>
  <p class="svh-note">Headless compact cards from authorized text. Not Search. Not the Features catalog. Gemini stays off. Sign-in is not required.</p>
  <form class="svh-form" id="svhForm">
    <label class="visually-hidden" for="svhInput">Authorized text</label>
    <textarea id="svhInput" maxlength="2000" placeholder="Paste authorized text…"></textarea>
    <div class="svh-actions">
      <button class="buttonlike" type="submit">Render SMARTview</button>
    </div>
  </form>
  <p class="svh-status" id="svhStatus" role="status"></p>
  <div id="svhHost" class="botdee-sv-host svh-host" aria-live="polite"></div>
  <script src="./floqr-i18n.js?v=s3.3.075"></script>
  <script src="./floqr-nav.js?v=s3.3.075"></script>
  <script src="./floqr-save-busy.js?v=s3.3.075"></script>
  <script src="./floqr-chrome-scheme.js?v=s3.3.075"></script>
  <script src="./smartvisuals-resolver.js?v=s3.3.075"></script>
  <script src="./smartvisuals-view.js?v=s3.3.075"></script>
  <script src="./botdee-smartview.js?v=s3.3.075"></script>
  <script src="./botdee-smartview-headless.js?v=s3.3.075"></script>
  <script>
    (function () {
      const api = window.FLOQRBotDeeSmartViewHeadless;
      const params = new URLSearchParams(location.search);
      if (params.has("shot")) document.documentElement.setAttribute("data-shot", "1");
      const mode = api.modeFromSearch(params);
      document.documentElement.setAttribute("data-mode", mode);
      const input = document.getElementById("svhInput");
      const host = document.getElementById("svhHost");
      const status = document.getElementById("svhStatus");
      const form = document.getElementById("svhForm");
      window.FLOQRChromeScheme?.applyDocument?.();

      function paint(raw) {
        const result = api.cardsFromAuthorizedText(raw, {tag: api.tagFromSearch(params)});
        if (!result.ok) {
          host.innerHTML = "";
          status.textContent = result.reason === "prompt-injection-ignored"
            ? "That text was ignored."
            : "Paste authorized text to render compact SMARTview cards.";
          return result;
        }
        status.textContent = result.views.length === 1
          ? "1 compact SMARTview card."
          : result.views.length + " compact SMARTview cards.";
        window.FLOQRBotDeeSmartView.mount(host, result.views);
        return result;
      }

      const initial = api.queryFromSearch(params);
      if (input) input.value = initial;
      if (initial) paint(initial);
      else status.textContent = "Paste authorized text to render compact SMARTview cards.";

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        const next = api.cardsFromAuthorizedText(input.value);
        const url = new URL(location.href);
        url.searchParams.set("mode", "interactive");
        if (input.value.trim()) url.searchParams.set("q", input.value.trim().slice(0, 2000));
        else url.searchParams.delete("q");
        history.replaceState({}, "", url.pathname + url.search);
        paint(input.value);
        return next;
      });
    })();
  </script>
</body>
</html>
