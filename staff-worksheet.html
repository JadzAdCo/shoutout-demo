<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Work Sheet - Weekly Staff Calendar</title>
  <link rel="stylesheet" href="./styles.css?v=29.09.115"/>
  <link rel="stylesheet" href="./admin.css?v=29.09.115"/>
</head>
<body>
<a id="floqrGlobalBack" class="global-back-btn buttonlike" href="./patron-portal.html?v=29.09.115">&larr; Back</a>
<main class="app admin-shell">
  <section class="page active">
    <header class="topbar">
      <div>
        <p class="eyebrow">Elected staff</p>
        <h1
          id="worksheetTitle"
          data-floqr-help-id="help-staff-worksheet"
          data-floqr-help-title="Work Sheet - Weekly Staff Calendar"
          data-floqr-help-search="staff calendar|work sheet|weekly staff calendar|colleague schedule|who is working"
          data-floqr-help-body="Read-only people × days grid of published shifts for everyone elected at this venue. Drafts are hidden. Open Staff Calendar from My Profile when you are an elected service member. Pick another club if you work at more than one."
        >Work Sheet - Weekly Staff Calendar</h1>
        <p class="sub" data-keep-visible="true">Published shifts only (pending / confirmed / declined). Your row is highlighted.</p>
        <p id="worksheetStatus" class="status">Sign in to continue.</p>
      </div>
      <div class="card">
        <p class="eyebrow">Account</p>
        <div class="queue-actions">
          <button id="worksheetGoogleLoginBtn" type="button">Google sign-in</button>
        </div>
      </div>
    </header>

    <div class="card">
      <h2 id="worksheetVenueHeading">Venue</h2>
      <div class="profile-grid">
        <label>Club
          <select id="worksheetVenueSelect"></select>
        </label>
      </div>
      <div class="sched-toolbar">
        <div class="queue-actions">
          <button type="button" id="worksheetPrevWeekBtn">← Prev</button>
          <strong id="worksheetWeekLabel">This week</strong>
          <button type="button" id="worksheetNextWeekBtn">Next →</button>
          <button type="button" id="worksheetTodayWeekBtn">This week</button>
          <button type="button" id="worksheetRefreshBtn">Refresh</button>
        </div>
      </div>
      <div id="worksheetWeekGrid" class="sched-grid-wrap" aria-live="polite"></div>
    </div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script>
<script src="./firebase-config.js?v=29.09.8"></script>
<script src="./floqai-help-repository.js?v=29.09.115"></script>
<script src="./help-attach.js?v=29.09.115"></script>
<script src="./helper-popouts.js?v=29.09.115"></script>
<script src="./floqr-nav.js?v=29.09.98"></script>
<script src="./assignment-card.js?v=s3.0.0"></script>
<script src="./staff-week-grid.js?v=s3.0.0"></script>
<script src="./staff-worksheet.js?v=29.09.115"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => window.FLOQRNav?.applyGlobalBack("floqrGlobalBack"));
</script>
</body>
</html>
