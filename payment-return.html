<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title data-i18n="page.payment.title">Payment Status | FLOQR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./styles.css?v=s3.2.64"/>
  <link rel="stylesheet" href="./admin.css?v=s3.2.64"/>
  <script>
    /* Paint Site chrome before CSS so receipts match Appearance (not stuck Nightlife). */
    try{
      var __floqrChromeMap={0:"nightlife",1:"traditional",2:"blackTiffany",3:"whiteBlack",4:"purpleWhite",5:"blackDarkGreen"};
      var __floqrChromeRaw=localStorage.getItem("floqr.isSiteChrome");
      var __floqrChrome=__floqrChromeMap[__floqrChromeRaw];
      if(!__floqrChrome){
        var __legacy=String(localStorage.getItem("floqr.uiChrome")||"").trim();
        if(__legacy==="traditional"||__legacy==="nightlife"||__legacy==="blackTiffany"||__legacy==="whiteBlack"||__legacy==="blackDarkGreen"||__legacy==="purpleWhite") __floqrChrome=__legacy;
      }
      if(__floqrChrome){
        document.documentElement.setAttribute("data-floqr-chrome",__floqrChrome);
        document.documentElement.setAttribute("data-is-site-chrome",String(__floqrChromeRaw!=null&&__floqrChromeRaw!==""?__floqrChromeRaw:({nightlife:0,traditional:1,blackTiffany:2,whiteBlack:3,purpleWhite:4,blackDarkGreen:5})[__floqrChrome]));
      }
    }catch(_){}
  </script>
</head>
<body>
<main class="app admin-shell">
  <section class="page active">
    <div class="card" id="paymentReturnAuth" data-floqr-auth-chrome>
      <h2 data-i18n="page.payment.signIn">Sign in to view payment</h2>
      <p class="sub small" data-i18n="page.payment.restoreHint">Use the same FLOQR account as Search / My Profile. This page restores that session.</p>
      <button id="paymentReturnGoogleLoginBtn" type="button" data-floqr-login-btn data-i18n="app.google">Continue with Google</button>
    </div>
    <div class="card payment-return-card">
      <p class="eyebrow">FLOQR Payments</p>
      <h1 id="paymentReturnTitle" data-i18n="page.payment.title">Checking paymentâ€¦</h1>
      <p id="paymentReturnStatus" class="sub" data-i18n="page.payment.waiting">Waiting for secure confirmation.</p>
      <div id="paymentReturnDetails" class="report-block"></div>
      <a class="buttonlike primary" href="./patron-portal.html?tab=inbox">Open FloqR Inbox</a>
      <a class="buttonlike" href="./floqcast-search.html?from=search">Open floqCast</a>
      <a class="buttonlike" href="./patron-portal.html?tab=shoutouts">View My ShoutOuts</a>
      <a class="buttonlike" href="./">Return to FLOQR</a>
    </div>
  </section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-functions-compat.js"></script>
<script src="./firebase-config.js?v=s3.2.64"></script>
<script src="./floqr-chrome-scheme.js?v=s3.2.64"></script>
<script src="./floqr-chrome-audit.js?v=s3.2.64"></script>
<script src="./floqr-i18n.js?v=s3.2.64"></script>
<script src="./floqr-session-shell.js?v=s3.2.64"></script>
<script src="./floqr-logger.js?v=s3.2.64"></script>
<script src="./payment-service.js?v=s3.2.64"></script>
<script src="./floqr-nav.js?v=s3.2.64"></script>
<script src="./payment-return-app.js?v=s3.2.64"></script>
</body>
</html>
