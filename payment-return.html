<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Payment Status | FLOQR</title>
  <link rel="stylesheet" href="./styles.css?v=29.09.56"/>
  <link rel="stylesheet" href="./admin.css?v=29.09.56"/>
</head>
<body>
<main class="app admin-shell">
  <section class="page active">
    <div class="card" id="paymentReturnAuth" data-floqr-auth-chrome>
      <h2>Sign in to view payment</h2>
      <p class="sub small">Use the same FLOQR account as Search / My Profile. This page restores that session.</p>
      <button id="paymentReturnGoogleLoginBtn" type="button" data-floqr-login-btn>Continue with Google</button>
    </div>
    <div class="card payment-return-card">
      <p class="eyebrow">FLOQR Payments</p>
      <h1 id="paymentReturnTitle">Checking payment…</h1>
      <p id="paymentReturnStatus" class="sub">Waiting for secure confirmation.</p>
      <div id="paymentReturnDetails" class="report-block"></div>
      <a class="buttonlike primary" href="./patron-portal.html?tab=inbox&v=29.09.56">Open FloqR Inbox</a>
      <a class="buttonlike" href="./suprstr-search.html?v=29.09.66&from=search">Open supRstar</a>
      <a class="buttonlike" href="./patron-portal.html?tab=shoutouts&v=29.09.56">View My ShoutOuts</a>
      <a class="buttonlike" href="./?v=29.09.56">Return to FLOQR</a>
    </div>
  </section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script src="./floqr-session-shell.js?v=s3.0.3"></script>
<script src="./floqr-logger.js?v=29.09.56"></script>
<script src="./payment-service.js?v=29.09.72"></script>
<script src="./payment-return-app.js?v=s3.0.3"></script>
</body>
</html>
