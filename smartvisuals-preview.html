<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SMARTvisuals QA preview</title>
  <link rel="stylesheet" href="./styles.css?v=s3.3.046"/>
  <link rel="stylesheet" href="./smartvisuals-view.css?v=s3.3.046"/>
  <style>
    body{margin:0;padding:16px;background:#05070c;color:#f4fbff}
    .qa-row{display:grid;gap:16px;max-width:860px;margin:0 auto}
    @media(min-width:820px){.qa-row{grid-template-columns:1fr 1fr}}
    h1{font-size:16px;margin:0 0 12px}
  </style>
</head>
<body data-floqr-public data-floqr-chrome="nightlife">
  <h1>SMARTvisuals QA — Cancun Trip (synthetic)</h1>
  <div class="qa-row">
    <div id="notifyHost"></div>
    <div id="roomHost"></div>
  </div>
  <script src="./smartvisuals-resolver.js?v=s3.3.046"></script>
  <script src="./smartvisuals-view.js?v=s3.3.046"></script>
  <script>
    fetch("./smartvisuals/catalog.json").then(r => r.json()).then(catalog => {
      window.FLOQRSmartVisualsCatalog = catalog;
      const payload = window.FLOQRSmartVisuals.syntheticCancun();
      window.FLOQRSmartVisuals.mountNotification(document.getElementById("notifyHost"), payload, {});
      window.FLOQRSmartVisuals.mountRoom(document.getElementById("roomHost"), payload, {});
    });
  </script>
</body>
</html>
