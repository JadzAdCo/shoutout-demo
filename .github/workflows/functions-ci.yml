name: Functions CI and Deploy

on:
  push:
    branches: [main, master, test]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/functions-ci.yml"
  pull_request:
    branches: [main, master, test]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/functions-ci.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy Functions + rules to Firebase (requires FIREBASE_TOKEN secret)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: functions-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Functions tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy Firebase Functions and rules
    needs: test
    # workflow_dispatch deploy=true (preferred) OR push to main whose commit
    # message contains [firebase-deploy] (agent path when dispatch is 403).
    if: >
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.deploy == 'true') ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[firebase-deploy]'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Require FIREBASE_TOKEN
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "Add repo secret FIREBASE_TOKEN (from: firebase login:ci) before deploying."
            exit 1
          fi

      - name: Deploy Firestore rules + Storage rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: "true"
        run: |
          # firestore:rules only — full `firestore` also deploys indexes and fails
          # non-interactive when live has indexes missing from firestore.indexes.json
          # (would need --force, which can delete those live indexes).
          firebase deploy \
            --only firestore:rules,storage \
            --project shoutoutdemo-5b402 \
            --non-interactive

      - name: Ensure FLOQR_OIDC_JWT_SECRET
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: "true"
        run: |
          # Create once if missing. Never print the value. Do not rotate an existing secret.
          # firebase-tools@13 has secrets:get (metadata), not secrets:list.
          set -euo pipefail
          set +x
          set +e
          firebase functions:secrets:get FLOQR_OIDC_JWT_SECRET --project shoutoutdemo-5b402 --non-interactive >/tmp/oidc-secret-meta.txt 2>/tmp/oidc-secret-meta.err
          GET_STATUS=$?
          set -e
          rm -f /tmp/oidc-secret-meta.txt /tmp/oidc-secret-meta.err
          if [ "$GET_STATUS" -eq 0 ]; then
            echo "FLOQR_OIDC_JWT_SECRET already exists"
            exit 0
          fi
          echo "Creating FLOQR_OIDC_JWT_SECRET (value not logged)"
          openssl rand -base64 48 | firebase functions:secrets:set FLOQR_OIDC_JWT_SECRET --project shoutoutdemo-5b402 --non-interactive --data-file -

      - name: Recreate OIDC HTTP functions without plaintext secret env
        # Only when this job will also deploy those two HTTP functions.
        # A BOT DEE / crawl / SOS2FA subset must not delete them (s3.3.031).
        if: contains(github.event.head_commit.message, '[firebase-deploy-spatial]')
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: "true"
        run: |
          # Cloud Run 400: "Secret environment variable overlaps non secret
          # environment variable: FLOQR_OIDC_JWT_SECRET" when a leftover plaintext
          # env (from an earlier process.env deploy) still sits on the service.
          # Recreate the two HTTP functions so defineSecret can bind the name.
          set -euo pipefail
          for fn in floqrOidcToken floqrSpatialGrant; do
            firebase functions:delete "$fn" --region us-central1 --project shoutoutdemo-5b402 --non-interactive --force || true
          done

      - name: Deploy Functions in batches
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: "true"
          FUNCTIONS_DISCOVERY_TIMEOUT: "300"
        run: |
          # Full `firebase deploy --only functions` updates ~200 Gen2 services at once
          # and hits Cloud Run CPU + Cloud Functions mutation/minute quotas.
          # Batch like deploy-reconcile.ps1 (size 20, cool-down, 3 retries).
          # Subset tags are independent (union): [firebase-deploy-spatial] and
          # [firebase-deploy-features] in one commit deploy both lists.
          # [firebase-deploy-crawl] deploys only AI Crawling callables/schedules (includes
          # first-time scheduledRetirePastCrawledEvents, which functions:list cannot see yet).
          # [firebase-deploy-smartvisuals] deploys SMARTvisuals Studio callables (first-time
          # names that functions:list cannot see yet).
          set -euo pipefail
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          FNS=()
          add_fns() {
            local f
            for f in "$@"; do
              if [ "${#FNS[@]}" -eq 0 ] || ! printf '%s\n' "${FNS[@]}" | grep -qx "$f"; then
                FNS+=("$f")
              fi
            done
          }
          SUBSET=0
          if echo "$COMMIT_MSG" | grep -q '\[firebase-deploy-sos2fa\]'; then
            SUBSET=1
            add_fns verifySos2faRecoveryCode
            echo "SOS2FA recovery deploy tagged"
          fi
          if echo "$COMMIT_MSG" | grep -q '\[firebase-deploy-spatial\]'; then
            SUBSET=1
            add_fns \
              issueFloqrOidcAuthCode \
              floqrOidcToken \
              recordSpatialGrantRef \
              listMySpatialGrants \
              revokeSpatialGrantRef \
              attachGuestDraftToSubject \
              floqrSpatialGrant \
              floqmediaPlanTrace \
              createSinemaScene \
              saveSinemaScene \
              loadSinemaScene
            echo "Spatial Studio FloqR-only deploy tagged"
          fi
          if echo "$COMMIT_MSG" | grep -q '\[firebase-deploy-features\]'; then
            SUBSET=1
            add_fns setFeatureServiceFlags seedFeatureServices findBetaPatron setBetaTesterFeatures
            echo "Features & Services catalog deploy tagged"
          fi
          if echo "$COMMIT_MSG" | grep -q '\[firebase-deploy-crawl\]'; then
            SUBSET=1
            add_fns \
              scheduledAiDiscoveryCrawl \
              scheduledRetirePastCrawledEvents \
              retirePastCrawledEvents \
              runFloqrDiscoveryCrawl \
              runInstantDiscoveryCrawl \
              previewDiscoveryAutoApprove
            echo "Crawl-only deploy tagged"
          fi
          if echo "$COMMIT_MSG" | grep -q '\[firebase-deploy-smartvisuals\]'; then
            SUBSET=1
            add_fns \
              classifySmartVisual \
              publishSmartVisualDraft \
              setSmartVisualOverride \
              getSmartVisualAdPolicy
            echo "SMARTvisuals Studio deploy tagged"
          fi
          if echo "$COMMIT_MSG" | grep -q '\[firebase-deploy-botdee\]'; then
            SUBSET=1
            add_fns \
              executeBotSession \
              getBotDeeThread \
              renameBotDeeChat \
              saveBotDeePersonalization \
              setBotDeeSettings \
              getBotDeeAccess \
              getBotDeeCapabilityManifest \
              getBotDeeConsent \
              setBotDeeConsent \
              listBotDeeMemories \
              upsertBotDeeMemory \
              deleteBotDeeMemory \
              exportBotDeeData \
              deleteBotDeeArchive \
              listBotDeeSmartViews \
              getPeopleSmartView \
              searchPeopleSmartCards \
              saveSmartSummary \
              queuePeopleSmartViewAnalysis \
              processSmartViewTranslationJob \
              onUserProfileSmartViewWrite \
              onSmartViewTranslationJobCreated \
              submitBotDeeEvidenceFeedback \
              disputeBotDeeIdentityMatch \
              getBotDeeLegalGates \
              setBotDeeLegalGate \
              getBotDeeProviderSlots \
              listBotDeeProviderSlots \
              setBotDeeProviderSlot \
              createHeadlessShoutOutCheckout \
              createBotDeeRoom \
              createBotDeeRoomInvite \
              inviteBotDeeRoomGuest \
              acceptBotDeeRoomInvite \
              leaveBotDeeRoom \
              kickBotDeeRoomMember \
              endBotDeeRoom \
              listBotDeeRoomFriends \
              getBotDeeRoom \
              setBotDeeRoomItinerary \
              optInBotDeeRoomTab \
              addBotDeeRoomTabLine \
              acceptBotDeeRoomTabLine \
              voidBotDeeRoomTabLine \
              closeBotDeeRoomTab \
              postBotDeeRoomTurn \
              revokeBotDeeRoomInvite \
              createFloqrCheckoutSession
            echo "BOT DEE hasUsedBotDee persist + six-phase + later-fill slot + Mingl session invites deploy tagged"
          fi
          if [ "$SUBSET" = "0" ]; then
            mapfile -t FNS < <(
              firebase functions:list --project shoutoutdemo-5b402 --json \
                | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{
                    const j=JSON.parse(s); const rows=j.result||j;
                    const ids=[...new Set((rows||[]).map(r=>r.id||r.entryPoint).filter(Boolean))].sort();
                    if(!ids.length){console.error("no functions listed"); process.exit(1);}
                    process.stdout.write(ids.join("\n")+"\n");
                  });'
            )
            if ! printf '%s\n' "${FNS[@]}" | grep -qx 'scheduledRetirePastCrawledEvents'; then
              FNS+=("scheduledRetirePastCrawledEvents")
            fi
            # First-time BOT DEE six-phase callables (functions:list cannot see them yet).
            # Redeploy from origin/main after Instant Crawl merge cancelled the first batch run.
            for f in \
              classifySmartVisual \
              publishSmartVisualDraft \
              setSmartVisualOverride \
              getSmartVisualAdPolicy \
              executeBotSession \
              getBotDeeThread \
              renameBotDeeChat \
              getBotDeeAccess \
              getBotDeeCapabilityManifest \
              getBotDeeConsent \
              setBotDeeConsent \
              listBotDeeMemories \
              upsertBotDeeMemory \
              deleteBotDeeMemory \
              exportBotDeeData \
              deleteBotDeeArchive \
              listBotDeeSmartViews \
              getPeopleSmartView \
              searchPeopleSmartCards \
              saveSmartSummary \
              queuePeopleSmartViewAnalysis \
              processSmartViewTranslationJob \
              onUserProfileSmartViewWrite \
              onSmartViewTranslationJobCreated \
              submitBotDeeEvidenceFeedback \
              disputeBotDeeIdentityMatch \
              getBotDeeLegalGates \
              setBotDeeLegalGate \
              getBotDeeProviderSlots \
              listBotDeeProviderSlots \
              setBotDeeProviderSlot \
              createBotDeeRoom \
              createBotDeeRoomInvite \
              inviteBotDeeRoomGuest \
              acceptBotDeeRoomInvite \
              leaveBotDeeRoom \
              kickBotDeeRoomMember \
              endBotDeeRoom \
              listBotDeeRoomFriends \
              getBotDeeRoom \
              setBotDeeRoomItinerary \
              optInBotDeeRoomTab \
              addBotDeeRoomTabLine \
              acceptBotDeeRoomTabLine \
              voidBotDeeRoomTabLine \
              closeBotDeeRoomTab \
              postBotDeeRoomTurn \
              revokeBotDeeRoomInvite \
              createFloqrCheckoutSession
            do
              if ! printf '%s\n' "${FNS[@]}" | grep -qx "$f"; then
                FNS+=("$f")
              fi
            done
          fi
          echo "Deploying ${#FNS[@]} functions in batches of 20"
          BATCH=20
          SLEEP_BETWEEN=75
          for ((i=0; i<${#FNS[@]}; i+=BATCH)); do
            slice=("${FNS[@]:i:BATCH}")
            only=$(printf 'functions:%s,' "${slice[@]}" | sed 's/,$//')
            echo "::group::Batch $((i/BATCH+1)) (${#slice[@]}): ${slice[*]}"
            ok=0
            for attempt in 1 2 3; do
              if firebase deploy --only "$only" --project shoutoutdemo-5b402 --non-interactive; then
                ok=1
                break
              fi
              echo "Batch failed attempt $attempt — waiting ${SLEEP_BETWEEN}s (quota cool-down)"
              sleep "$SLEEP_BETWEEN"
            done
            echo "::endgroup::"
            if [ "$ok" != "1" ]; then
              echo "Deploy failed for: ${slice[*]}"
              exit 1
            fi
            if (( i + BATCH < ${#FNS[@]} )); then
              echo "Cool-down ${SLEEP_BETWEEN}s before next batch…"
              sleep "$SLEEP_BETWEEN"
            fi
          done
          echo "All ${#FNS[@]} functions deployed."

      - name: Set FLOQR_APP_CHECK_ENFORCE=1 on floqmediaPlanTrace
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: "true"
        run: |
          set -euo pipefail
          export NODE_PATH="$(npm root -g)"
          node functions/scripts/set-floqmedia-plan-trace-app-check-env.js
