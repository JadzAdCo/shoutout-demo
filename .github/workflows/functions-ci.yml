name: Functions CI and Deploy

on:
  push:
    branches: [main, master, test]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/functions-ci.yml"
  pull_request:
    branches: [main, master, test]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/functions-ci.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy Functions + rules to Firebase (requires FIREBASE_TOKEN secret)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: functions-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Functions tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy Firebase Functions and rules
    needs: test
    # workflow_dispatch deploy=true (preferred) OR push to main whose commit
    # message contains [firebase-deploy] (agent path when dispatch is 403).
    if: >
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.deploy == 'true') ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[firebase-deploy]'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Require FIREBASE_TOKEN
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "Add repo secret FIREBASE_TOKEN (from: firebase login:ci) before deploying."
            exit 1
          fi

      - name: Deploy Firestore rules + Storage rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: "true"
        run: |
          # firestore:rules only — full `firestore` also deploys indexes and fails
          # non-interactive when live has indexes missing from firestore.indexes.json
          # (would need --force, which can delete those live indexes).
          firebase deploy \
            --only firestore:rules,storage \
            --project shoutoutdemo-5b402 \
            --non-interactive

      - name: Deploy Functions in batches
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: "true"
          FUNCTIONS_DISCOVERY_TIMEOUT: "300"
        run: |
          # Full `firebase deploy --only functions` updates ~200 Gen2 services at once
          # and hits Cloud Run CPU + Cloud Functions mutation/minute quotas.
          # Batch like deploy-reconcile.ps1 (size 20, cool-down, 3 retries).
          # [firebase-deploy-crawl] deploys only AI Crawling callables/schedules (includes
          # first-time scheduledRetirePastCrawledEvents, which functions:list cannot see yet).
          set -euo pipefail
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if echo "$COMMIT_MSG" | grep -q '\[firebase-deploy-crawl\]'; then
            FNS=(
              scheduledAiDiscoveryCrawl
              scheduledRetirePastCrawledEvents
              retirePastCrawledEvents
              runFloqrDiscoveryCrawl
              runInstantDiscoveryCrawl
              previewDiscoveryAutoApprove
            )
            echo "Crawl-only deploy: ${FNS[*]}"
          else
            mapfile -t FNS < <(
              firebase functions:list --project shoutoutdemo-5b402 --json \
                | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{
                    const j=JSON.parse(s); const rows=j.result||j;
                    const ids=[...new Set((rows||[]).map(r=>r.id||r.entryPoint).filter(Boolean))].sort();
                    if(!ids.length){console.error("no functions listed"); process.exit(1);}
                    process.stdout.write(ids.join("\n")+"\n");
                  });'
            )
            if ! printf '%s\n' "${FNS[@]}" | grep -qx 'scheduledRetirePastCrawledEvents'; then
              FNS+=("scheduledRetirePastCrawledEvents")
            fi
          fi
          echo "Deploying ${#FNS[@]} functions in batches of 20"
          BATCH=20
          SLEEP_BETWEEN=75
          for ((i=0; i<${#FNS[@]}; i+=BATCH)); do
            slice=("${FNS[@]:i:BATCH}")
            only=$(printf 'functions:%s,' "${slice[@]}" | sed 's/,$//')
            echo "::group::Batch $((i/BATCH+1)) (${#slice[@]}): ${slice[*]}"
            ok=0
            for attempt in 1 2 3; do
              if firebase deploy --only "$only" --project shoutoutdemo-5b402 --non-interactive; then
                ok=1
                break
              fi
              echo "Batch failed attempt $attempt — waiting ${SLEEP_BETWEEN}s (quota cool-down)"
              sleep "$SLEEP_BETWEEN"
            done
            echo "::endgroup::"
            if [ "$ok" != "1" ]; then
              echo "Deploy failed for: ${slice[*]}"
              exit 1
            fi
            if (( i + BATCH < ${#FNS[@]} )); then
              echo "Cool-down ${SLEEP_BETWEEN}s before next batch…"
              sleep "$SLEEP_BETWEEN"
            fi
          done
          echo "All ${#FNS[@]} functions deployed."
