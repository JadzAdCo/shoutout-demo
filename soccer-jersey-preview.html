<!doctype html>
<html><head><meta charset='utf-8'><title>Soccer jersey preview</title>
<style>
body{margin:0;background:#000;color:#eee;font:14px/1.3 system-ui;padding:16px}
h1{font-size:18px;margin:0 0 12px}
h2{font-size:15px;margin:20px 0 10px;font-weight:600}
p{max-width:52rem;margin:0 0 12px;color:#bbb}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
figure{margin:0;background:#1a1a1a;border:1px solid #333;padding:8px}
img{width:100%;height:280px;object-fit:contain;background:#000;display:block}
figcaption{margin-top:8px;text-align:center}

<h1>Soccer jersey assets (local)</h1>
<p>LED and this preview use named jerseys only — no wooden or black hangers in the photo. Country/club wordmark sits at the collar (slight shoulder curve). Patron name and number overlay lower on the empty back.</p>
